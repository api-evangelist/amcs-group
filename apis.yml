aid: amcs-group
name: AMCS Group
description: >-
  AMCS Group is an enterprise cloud software provider for the waste, recycling,
  resource and transport industries, headquartered in Ireland and backed by
  Insight Partners. Its flagship AMCS Platform exposes a REST API spanning Core,
  ERP Platform, Pay, Scale, TLV and Vision AI services, covering directory,
  accounting, transport, fleet, municipal and weighbridge operations. The API
  authenticates with a Personal Access Token exchanged for a session cookie,
  ships Swagger documentation, a hosted sandbox, a Node.js reference client, a
  Terraform provider, and an API Accelerator Program with pre-coded, MIT-licensed
  integration templates covering most of a typical integration project.
