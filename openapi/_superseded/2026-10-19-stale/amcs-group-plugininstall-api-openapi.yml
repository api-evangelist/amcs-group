          - integer
          - 'null'
          format: int32
        tempIdentifier:
          type:
          - string
          - 'null'
        pluginMetadataId:
          type:
          - integer
          - 'null'
          format: int32
        name:
          type:
          - string
          - 'null'
        credentials:
          type:
          - string
          - 'null'
        endpoint:
          type:
          - string
          - 'null'
        dependsOnPlugins:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AMCS.Core.Entity.Api.Plugin.ApiPluginMetadata'
        isOptionalDependency:
          type: boolean
      additionalProperties: false
