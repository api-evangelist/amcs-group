openapi: 3.2.0
info:
  title: Core Plugin Install API
  version: core
tags:
- name: PluginInstall
paths:
  /plugins/PluginMetadatas:
    post:
      tags:
      - PluginInstall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.Core.Entity.Api.Plugin.ApiPluginMetadata'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.Core.Entity.Api.Plugin.ApiPluginMetadata'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.Core.Entity.Api.Plugin.ApiPluginMetadata'
      responses:
