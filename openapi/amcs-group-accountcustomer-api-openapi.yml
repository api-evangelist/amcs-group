paths:
  /accounting/accountCustomers/changes:
    get:
      tags:
      - AccountCustomer
      summary: Retrieve changes
      description: '| Property | Description |

        | ------------------------- | ------------------------------------------------------------------------ |

        | GUID | The GUID associated to the customer. |

        | Name | The customer''s name. |

        | Reference | An alternative name used for the customer. |

        | FederalId | The customer''s local authority / government / tax reference. |

        | IsInternal | Whether the customer is an internal customer. |

        | ARAccountCode | Used to filter customers on the accounts receivable code. |

        | APAccountCode | Used to filter customers on the accounts payable code. |

        | Notes| Notes of customer. |

        | AMICENumber| AMICE Number of customer. |

        | CoCNumber| CoC Number of customer. |

        | HasRedLight | Red light indicator passed to driver to indicate the mood of the end customer.|

        | CombineChargesRebates | Rebate are included on the invoice, otherwise a separate bill is generated for rebates. |

        | ExternalVehicleValidation | The customer uses their own vehicles and the weighbridge will need to validate the vehicle registrations against a list held on the AMCS Platform. |

        | TicketsRequiredWithInvoice | Tickets are required with invoice. |

        | RctCustomer | In the Republic of Ireland the customer is a contractor liable for Relevent Contractors Tax. |

        | ProofOfServiceRequired | Customers need to sign tickets. |

        | ExcludeFromStatementRun | Excludes them from the batch statement run. |

        | ReceiveServiceUpdatesByEmail | Customer receives service updates by email. |

        | ReceiveServiceUpdatesByText | Customer receives service updates by text. |

        | ReceiveMarketingUpdatesByEmail | Customer receives marketing updates by email. |

        | ReceiveMarketingUpdatesByText | Customer receives marketing updates by text. |

        | CompanyListItem | The GUID and name of the company this customer is associated to. |

        | CustomerStateListItem | The GUID and status of the customer (eg. Active, Suspended, etc.). |

        | CustomerStateChangeReasonListItem | The GUID and reason of the latest state change. |

        | CustomerTypeListItem | The GUID and type of customer (eg. Residential, Commerical, Municipal). |

        | CustomerCategoryListItem | The GUID and category of the customer (various values). |

        | CustomerGroupListItem | The GUID and group of the customer (various values). |

        | VisitStatusListItem | The GUID and description of the visit status of the customer |

        | CurrencyListItem | The GUID and currency of the customer (various values). |

        | CustomerTemplateListItem| The GUID and customer template of the customer (various values). |

        | BusinessTypeListItem | The GUID and business type of the customer (various values). |

        | AutoArAccountCode| The object allowing for creation of an ArAccountCode, depending on system configuration. |

        | AutoArAccountCode.CompanyOutletGuid | The GUID of the company outlet used for creation of an ArAccountCode, depending on system configuration. |

        | RelatedUserSalesRepGuid | The GUID of the related sales rep. |

        | RelatedUserCreditControllerGuid | The GUID of the related credit controller. |

        | RelatedMasterAccountGuid | The GUID of the related master account. |

        | RelatedBillToCustomerGuid | The GUID of the related customer where the bills must be send to. |

        | RelatedLocationHQGuid| The GUID associated to the HQ location of the customer. |

        | BankDetails| The object where bank details are specified. |

        | BankDetails.BankName | The bank name of the direct debit. |

        | BankDetails.AccountName | The account name of the direct debit. |

        | BankDetails.AccountNo | The account number of the direct debit. |

        | BankDetails.SortCode | The sort code of the direct debit. |

        | BankDetails.BIC | The Bank Identifier Code of the direct debit. |

        | BankDetails.IBAN | The International Bank Account Number of the direct debit. |

        | BankDetails.NationalBankCode | The National Bank Code of the direct debit. |

        | BankDetails.DirectDebitRunConfigListItem | The GUID and description of the direct debit run configuration.'
      operationId: AccountCustomer_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorAccountCustomerResource'
