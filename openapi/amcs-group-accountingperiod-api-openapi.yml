openapi: 3.0.1
info:
  title: Core AccessGroup AccountingPeriod API
  version: core
tags:
- name: AccountingPeriod
paths:
  /lists/accountingPeriods/changes:
    get:
      tags:
      - AccountingPeriod
      summary: Retrieve changes
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the accounting period                             |\r\n| Description               | The description of the accounting period                                 |\r\n| Code                      | The code of the accounting period                                        |\r\n| IsClosed| Whether the accounting period is closed   |\r\n| StartDate                 | The Start Date associated to the accounting period                       |\r\n| EndDate                   | The End Date associated to the accounting period                         |"
      operationId: AccountingPeriod_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges[ApiIntegratorAccountingPeriodResource]'
  /lists/accountingPeriods/{guid}:
    get:
      tags:
      - AccountingPeriod
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the accounting period                             |\r\n| Description               | The description of the accounting period                                 |\r\n| Code                      | The code of the accounting period                                        |\r\n| IsClosed| Whether the accounting period is closed   |\r\n| StartDate                 | The Start Date associated to the accounting period                       |\r\n| EndDate                   | The End Date associated to the accounting period                         |"
      operationId: AccountingPeriod_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorAccountingPeriodResource]'
  /lists/accountingPeriods:
    get:
      tags:
      - AccountingPeriod
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the accounting period                             |\r\n| Description               | The description of the accounting period                                 |\r\n| Code                      | The code of the accounting period                                        |\r\n| IsClosed| Whether the accounting period is closed   |\r\n| StartDate                 | The Start Date associated to the accounting period                       |\r\n| EndDate                   | The End Date associated to the accounting period                         |"
      operationId: AccountingPeriod_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorAccountingPeriodResource]'
components:
  schemas:
    ApiResourceResultCollection[ApiIntegratorAccountingPeriodResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorAccountingPeriodResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultUpdatesExtra:
      type: object
      properties:
        until:
          type: string
        cursor:
          type: string
    ApiResourceResultEntity[ApiIntegratorAccountingPeriodResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorAccountingPeriodResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiResourceChanges[ApiIntegratorAccountingPeriodResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorAccountingPeriodResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultUpdatesExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiIntegratorAccountingPeriodResource:
      type: object
      properties:
        Description:
          type: string
        Code:
          type: string
        IsClosed:
          type: boolean
        StartDate:
          type: string
          format: localDate
          example: '2000-01-01'
        EndDate:
          type: string
          format: localDate
          example: '2000-01-01'
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
