openapi: 3.0.1
info:
  title: Core AccessGroup Action API
  version: core
tags:
- name: Action
paths:
  /lists/actions/{guid}:
    get:
      tags:
      - Action
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the action                       |\r\n| Description               | The description of the action               |\r\n| AnalysisCode              | The analysis code of the action       |\r\n| IsDeleted                 | Whether the action is deleted                              |\r\n| ShortAction               | The short code of the action                                             |\r\n| EquivalentHaul            | The equivalent haul of the action                                        |\r\n| ActionTypes| The array of ActionType properties associated to the action   |\r\n| ActionTypes[0].Guid    | The GUID associated to the ActionTypeAction   |\r\n| ActionTypes[0].ActionTypeListItem    | The GUID and description of the ActionType   |\r\n\r\n"
      operationId: Action_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorActionResource]'
  /lists/actions:
    get:
      tags:
      - Action
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the action                       |\r\n| Description               | The description of the action               |\r\n| AnalysisCode              | The analysis code of the action       |\r\n| IsDeleted                 | Whether the action is deleted                              |\r\n| ShortAction               | The short code of the action                                             |\r\n| EquivalentHaul            | The equivalent haul of the action                                        |\r\n| ActionTypes| The array of ActionType properties associated to the action   |\r\n| ActionTypes[0].Guid    | The GUID associated to the ActionTypeAction   |\r\n| ActionTypes[0].ActionTypeListItem    | The GUID and description of the ActionType   |\r\n\r\n"
      operationId: Action_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorActionResource]'
components:
  schemas:
    ApiIntegratorListItemResource:
      type: object
      properties:
        Description:
          type: string
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorActionTypesResource:
      type: object
      properties:
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        ActionTypeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
    ApiIntegratorActionResource:
      type: object
      properties:
        Description:
          type: string
        IsDeleted:
          type: boolean
        AnalysisCode:
          type: string
        ShortAction:
          type: string
        EquivalentHaul:
          type: number
          format: double
        ActionTypes:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorActionTypesResource'
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiResourceResultCollection[ApiIntegratorActionResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorActionResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceResultEntity[ApiIntegratorActionResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorActionResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
