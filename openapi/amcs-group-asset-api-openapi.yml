openapi: 3.2.0
info:
  title: Amcs Group Asset API
  version: external
  description: 'Operations tagged Asset across 2 of this provider''s published API definitions: amcs-group-openapi.json, amcs-group-visionai-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://eu1-tracker-dev-app.azurewebsites.net
  description: Direct Access
- url: https://o1-dev-svc-core.amcsplatform.com/
  description: AMCS VisionAI Developer Environment
tags:
- name: Asset
paths:
  /integrator/assets/changes:
    get:
      tags:
      - Asset
      summary: Request list of Asset changes
      description: '# Request list of Asset changes


        Retrieve the assets (vehicles) of the calling tenant that have been created, updated or deleted since a specific point in the history.


        ## Notes


        - Call without `since` to get the full list. Follow `links.next` while it is present, then store `extra.until` and send it as `since` on the next poll.

        - Deleted assets are returned with `IsDeleted: true`.'
      parameters:
      - name: since
        in: query
        description: Bookmark from extra.until
        style: form
        schema:
          type: string
      - name: cursor
        in: query
        description: Bookmark from extra.cursor
        style: form
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiAssetResource'
      operationId: getIntegratorAssetsChanges
      x-operation-id-source: derived
    servers:
    - url: https://eu1-tracker-dev-app.azurewebsites.net
      description: Direct Access
  /integrator/assets:
    post:
      tags:
      - Asset
      summary: Create or Update an Asset (Vehicle)
      description: '# Create or Update an Asset (Vehicle)'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiAssetResource'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    $ref: '#/components/schemas/ApiResourceErrors'
                  status:
                    $ref: '#/components/schemas/ApiResourceStatus'
                  resource:
                    type: string
                    description: GUID of the created or updated asset.
                    format: uuid
                additionalProperties: false
                description: Identifier of the created or updated resource.
      operationId: postIntegratorAssets
      x-operation-id-source: derived
    servers:
    - url: https://eu1-tracker-dev-app.azurewebsites.net
      description: Direct Access
  /visionai/api/integrator/assets:
    post:
      tags:
      - Asset
      summary: Create or Update an Asset (Vehicle)
      description: '# Create or Update an Asset (Vehicle)


        | Parameter | Type | Description |

        |--------------|--------|-----------------------------------------------------------------|

        | AssetId | GUID | ID of the Asset |

        | AssetName | string | Display name (vehicle registration plate) |

        | AssetType | string | Front Loader, Side Loader, Rear End Loader |

        | OutletId | GUID | ID of the Company Outlet associated with the Asset |

        | CompanyCode | string | Company code associated with the Asset |

        | IsDeleted | bool | Asset is no longer in use |


        ## Sample API Requests


        ```

        {

        "AssetId": "B3E43C4D-BC76-4E59-9E2E-25BC33EA2EC4",

        "AssetName": "VEH 001",

        "AssetType": "Front Loader",

        "OutletId": "2FAD788D-A748-4520-9120-923DA1E42942",

        "CompanyCode": "Trux Company 1",

        "IsDeleted": false

        }

        ```


        ## Sample API Response

        ```

        {

        "resource" : "B3E43C4D-BC76-4E59-9E2E-25BC33EA2EC4"

        }'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.IoT.Contamination.Api.Integrator.Asset.ApiAsset'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiauthTokens500Error'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - cookieAuth: []
      operationId: postVisionaiApiIntegratorAssets
      x-operation-id-source: derived
    servers:
    - url: https://o1-dev-svc-core.amcsplatform.com/
      description: AMCS VisionAI Developer Environment
