openapi: 3.2.0
info:
  description: '**Download Trux JSON**


    ---


    # Getting Started


    ## Document Purpose and Scope


    The VisionAI REST API endpoints are technically described in this document. This document''s goal is to instruct readers on how to interface with the VisionAI External REST API.


    ## Security


    We use PAT Tokens for authentication over HTTPS encrypted comms.


    A PAT token will be provided for you to use in your integration.


    You will use this PAT token to authenticate as follows.


    ### Request Format:


    POST: /visionai/api/authTokens


    Body: {"privateKey":"PATtokenstring"}


    ### Response Format:


    The response passes a SessionToken as a cookie called Platform.Tracker.SessionToken.


    This cookie should be included in the subsequent calls to the REST API.


    The API endpoints that are currently available are detailed below.'
  title: External Auth API
  version: external
servers:
- url: https://o1-dev-svc-core.amcsplatform.com/
  description: AMCS VisionAI Developer Environment
security:
- cookieAuth: []
tags:
- name: Auth
paths:
  /visionai/api/authTokens:
    post:
      tags:
      - Auth
      summary: Auth by Private Key
      description: 'This endpoint is used for authentication and authorisation of a calling application by supplying the Tenant Private Key in the privateKey property. When successful, Platform.VisionAI.SessionToken is added to the cookie.


        ## Request


        | **Property** | **Description** |

        | --- | --- |

        | PrivateKey | This is a Personal Access Token (PAT), generated during Tenant Registration. |


        ## Response

        Additional fields from the response, other from the one below, can be disregarded.


        | **Property** | **Description** |

        | --- | --- |

        | AuthResult | The authentication and authorization result. Returns "ok" if successful otherwise returns "invalidCredentials".'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.IoT.UserCredentials'
      responses:
        '200':
          description: Ok
          headers:
            Set-Cookie:
              schema:
                type: string
                example: Platform.VisionAI.SessionToken=abcde12345; Path=/; HttpOnly
                description: Subsequent calls to the REST API will use this cookie to authenticate and authorize requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AMCS.IoT.LoginResponse'
      operationId: postVisionaiApiAuthTokens
      x-operation-id-source: derived
components:
  schemas:
    AMCS.IoT.UserCredentials:
      type: object
      required:
      - privateKey
      properties:
        privateKey:
          type: string
          example: 1zEFtwJQE0cmKUE3AvnzBbm5
      additionalProperties: false
    AMCS.IoT.LoginResponse:
      type: object
      properties:
        authResult:
          type: string
          example: ok
        userName:
          type:
          - string
          - 'null'
          example: ADMIN01
        userIdentity:
          type:
          - string
          - 'null'
          example: ADMIN
        sysUserId:
          type:
          - integer
          - 'null'
          format: int32
          example: 3
        userGuid:
          type:
          - string
          - 'null'
          format: uuid
          example: 607e37cd-4f51-4148-af23-4459b74fc3b2
        companyOutletId:
          type:
          - integer
          - 'null'
          format: int32
          example: 10
        companyOutletGuid:
          type:
          - string
          - 'null'
          format: uuid
          example: 5feaaae5-7733-4e45-ac39-87d46cf138e0
        stayLoggedIn:
          type:
          - boolean
          - 'null'
          example: false
