openapi: 3.2.0
info:
  title: Core Auth Token API
  version: core
tags:
- name: Auth - Token
paths:
  /authTokens:
    get:
      tags:
      - Auth - Token
      parameters:
      - name: userName
        in: query
        schema:
          type: string
      - name: password
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
      summary: Get auth tokens
      x-summary-source: derived
      operationId: getAuthTokens
      x-operation-id-source: derived
    post:
      tags:
      - Auth - Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.ApiService.Controllers.UserCredentials'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.ApiService.Controllers.UserCredentials'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.ApiService.Controllers.UserCredentials'
      responses:
        '200':
          description: Success
      summary: Create auth tokens
      x-summary-source: derived
      operationId: postAuthTokens
      x-operation-id-source: derived
    delete:
      tags:
      - Auth - Token
      responses:
        '200':
          description: Success
      summary: Delete auth tokens
      x-summary-source: derived
      operationId: deleteAuthTokens
      x-operation-id-source: derived
  /authTokens/checkPluginAccess:
    post:
      tags:
      - Auth - Token
      parameters:
      - name: sysUserGuid
        in: query
        schema:
          type: string
          format: uuid
      - name: pluginId
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
      summary: Create auth tokens check plugin access
      x-summary-source: derived
      operationId: postAuthTokensCheckPluginAccess
      x-operation-id-source: derived
  /authTokens/verifyIdentity:
    post:
      tags:
      - Auth - Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.ApiService.Controllers.VerifyIdentityCredentials'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.ApiService.Controllers.VerifyIdentityCredentials'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.ApiService.Controllers.VerifyIdentityCredentials'
      responses:
        '200':
          description: Success
      summary: Create auth tokens verify identity
      x-summary-source: derived
      operationId: postAuthTokensVerifyIdentity
      x-operation-id-source: derived
components:
  schemas:
    AMCS.ApiService.Controllers.UserCredentials:
      type: object
      properties:
        username:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
        temporaryToken:
          type:
          - string
          - 'null'
        privateKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    AMCS.ApiService.Controllers.VerifyIdentityCredentials:
      type: object
      properties:
        username:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
      additionalProperties: false
