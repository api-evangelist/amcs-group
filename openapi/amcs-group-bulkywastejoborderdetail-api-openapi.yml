          example: 00000000-0000-0000-0000-000000000000
        IsSelected:
          type: boolean
        Type:
          type: string
        Service:
          type: string
        ContainerType:
          type: string
        Action:
          type: string
        Material:
          type: string
        PricingBasis:
          type: string
        Rate:
          type: number
          format: double
    ApiResourceErrors:
