openapi: 3.2.0
info:
  description: '**Download Trux JSON**


    ---


    # Getting Started


    ## Document Purpose and Scope


    The VisionAI REST API endpoints are technically described in this document.'
  title: External Camera Event API
  version: external
servers:
- url: https://o1-dev-svc-core.amcsplatform.com/
  description: AMCS VisionAI Developer Environment
security:
- cookieAuth: []
tags:
- name: CameraEvent
paths:
  /visionai/api/integrator/cameraEvents:
    post:
      tags:
      - CameraEvent
      summary: Create a contamination/overfilled from camera
      description: '# Create a contamination/overfilled from camera


        | Parameter | Type | Description |

        |-------------|--------|----------------------------------|

        | Asset | string | Vehicle Identified Registration or Asset Id|

        | Timestamp | DateTime | Local time or UTC time of the event|

        | Lat | double | Latitude |

        | Lon | double | Longitude |

        | EventType | string | Contamination or Overfilled event |

        | EventId | string | Unique Id for each event |

        | WasteType | string | The waste stream the truck is collecting |

        | MediaLink | string | URL to access the media file associate with each event |


        ## Sample API Requests


        ```

        {

        "Asset": "M879 EUS",

        "Timestamp": "2025-04-23 11:00:00",

        "Lon":-121.56767,

        "Lat":39.49120,

        "EventType": "Contamination",

        "EventId": "12345",

        "WasteType": "General Waste",

        "MediaLink" :"https://tem-production.s3.amazonaws.com/final_files/2025_03_14/82416/AWTI_VIN_2025_03_14_14_19_19_14019_c2_1ffdc5a0-0c80-4f15-b8be-9a16f690b2d0.mp4"

        }

        ```


        ## Sample API Response

        ```

        {

        "resource" : 1

        }

        ```'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.IoT.Contamination.Api.Integrator.CameraEvent.ApiCameraEvent'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      operationId: postVisionaiApiIntegratorCameraEvents
      x-operation-id-source: derived
