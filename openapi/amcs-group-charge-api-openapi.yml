            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity_ApiIntegratorChargeResource'
    put:
      tags:
      - Charge
      summary: Partial update
      description: '| Property| Description | Required |

        | --------------------------------- |--------------------------------------------------------------------- | -------- |

        | GUID| The Guid associated to the contact. | Yes |

        | RelatedSiteOrderGuid| The related site order Guid. | Yes |

        | RelatedJobGuid| The related Job Guid. | No |

        | RelatedLiftEventGuid| The related Lift event Guid. | No |

        | RelatedPriceGuid| The related Price Guid. | No |

        | RelatedRouteVisitGuid| The related Route visit Guid. | No |

        | RelatedRouteVisitJobGuid| The related Route visit job Guid. | No |

        | RelatedWeighingInGuid| The related Weighing In Guid. | No |

        | RelatedWeighingOutGuid| The related Weighing Out Guid. | No |

        | RelatedPONumberGuid| The related PO Number Guid. | No |

        | RelatedPriceModifierGuid| The related Price modifier Guid. | No |

        | RelatedInvoiceGuid| The related Invoice Guid. | No |

        | RelatedDepartmentGuid| The related Department Guid. | No |

        | RelatedServiceGuid| The related Service Guid. | No |

        | PONumber| The related PO Number. | No |

        | Amount.IsEstimate | Is the Amount an Estimation. | Yes |

        | Amount.Price| The price of the Amount. | Yes |

        | Amount.PriceExVat | The Price not including the Vat. | Yes |

        | Amount.Rate| The Rate of the Amount. | Yes |

        | DoNotInvoice| If the charge can be invoiced or not. | No |

        | DoNotInvoiceReasonListItem | The Guid and Description associated to the reason for DoNotInvoice. | No |

        | ActionListItem | The Guid and Description associated to the Action. | No |

        | ActionGuidFilter | Used to filter the action guid associated to the charge. | No |


        **Extra validations**


        | Condition | Error message |

        | --------- | ------------- |

        | RelatedSiteOrderGuid is being edited | RelatedSiteOrderGuid is a read-only property. |

        | RelatedJobGuid is being edited | RelatedJobGuid is a read-only property. |

        | RelatedLiftEventGuid is being edited | RelatedLiftEventGuid is a read-only property. |

        | RelatedPriceGuid is being edited | RelatedPriceGuid is a read-only property. |

        | RelatedRouteVisitGuid is being edited | RelatedRouteVisitGuid is a read-only property. |

        | RelatedRouteVisitJobGuid is being edited | RelatedRouteVisitJobGuid is a read-only property. |

        | RelatedWeighingInGuid is being edited | RelatedWeighingInGuid is a read-only property. |

        | RelatedWeighingOutGuid is being edited | RelatedWeighingOutGuid is a read-only property. |

        | RelatedPriceModifierGuid is being edited | RelatedPriceModifierGuid is a read-only property. |

        | RelatedInvoiceGuid is being edited | RelatedInvoiceGuid is a read-only property. |

        | RelatedDepartmentGuid is being edited | RelatedDepartmentGuid is a read-only property. |

        | RelatedServiceGuid is being edited | RelatedServiceGuid is a read-only property. |

        | ActionListItem.Guid is being edited | ActionListItem.Guid is a read-only property. |

        | Amount.IsEstimate is being edited | Amount.IsEstimate is a read-only property. |

        | Amount.Price is being edited | Amount.Price is a read-only property. |

        | Amount.PriceExVat is being edited | Amount.PriceExVat is a read-only property. |

        | Amount.Rate is being edited | Amount.Rate is a read-only property. |

        | Amount was set null | Amount field is not editable and cannot be null |

        | DoNotInvoiceReasonListItem is not in one of the following reason categories: DoNotInvoice | DoNotInvoiceReasonListItem must be in one of the following reason categories: DoNotInvoice. |

        | DoNotInvoice was set to true and DoNotInvoiceReasonListItem was null | Charge with DoNotInvoiceReasonListItem cannot be null if DoNotInvoice is true. |

        | DoNotInvoiceReasonListItem value was provided and DoNotInvoice was set to false | Charge with DoNotInvoice cannot be set if DoNotInvoiceReasonListItem has a value. |

        | RelatedPONumberGuid supplied belongs to a deleted PONumber | Failed to save/update Charge because the supplied PONumber is not valid. The update has been rejected.'
      operationId: Charge_Update
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegratorChargeResource'
        required: true
        x-bodyName: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
