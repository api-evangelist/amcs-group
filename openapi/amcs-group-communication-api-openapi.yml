      properties:
        RelatedJobGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        IsDeleted:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorCommunicationResource:
      type: object
      properties:
        ClosedDate:
          type: string
          format: localDate
          example: '2000-01-01'
        ExternalReference:
          type: string
        Notes:
          type: string
        OutcomeNotes:
          type: string
        RelatedUserOwnerGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        ReviewDate:
          type: string
          format: localDate
          example: '2000-01-01'
        CommunicationClassificationListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        CommunicationTypeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        CommunicationOutcomeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        Followups:
          type: array
          items:
