        RouteVisits:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorCommunicationRouteVisitResource'
        DocumentBlobs:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorCommunicationDocumentBlobHashesResource'
        Jobs:
