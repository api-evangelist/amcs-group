openapi: 3.0.1
info:
  title: Core AccessGroup ContainerStatus API
  version: core
tags:
- name: ContainerStatus
paths:
  /lists/containerStatuses/{guid}:
    get:
      tags:
      - ContainerStatus
      summary: Find with GUID
      description: "| Property                  | Description                                                       |\r\n| ------------------------- | ----------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the container status|\r\n| Description               | The description of the container status|\r\n| IsDeleted                 | Whether the container status is deleted  |\r\n| IsUnavailable| Whether the container status is unavailable  |"
      operationId: ContainerStatus_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorContainerStatusResource]'
  /lists/containerStatuses:
    get:
      tags:
      - ContainerStatus
      summary: Find with Filters
      description: "| Property                  | Description                                                       |\r\n| ------------------------- | ----------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the container status|\r\n| Description               | The description of the container status|\r\n| IsDeleted                 | Whether the container status is deleted  |\r\n| IsUnavailable| Whether the container status is unavailable  |"
      operationId: ContainerStatus_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorContainerStatusResource]'
components:
  schemas:
    ApiIntegratorContainerStatusResource:
      type: object
      properties:
        Description:
          type: string
        IsDeleted:
          type: boolean
        IsUnavailable:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiResourceResultCollectionExtra:
