      summary: Retrieve changes
      description: '| Property | Description |

        | -------------------- | --------------------------------------------------------------------- |

        | GUID | The GUID associated to the credit note. |

        | RelatedCustomerGuid | The GUID associated to the customer of this credit note. |

        | CreditNoteNumber | The credit note number. |

        | Reference | An alternative name used for the credit note. |

        | ExternalReference | The external reference associated to the credit note. |

        | IsCreditJournal | If true this credit note is a credit journal. |

        | IsTaxAdjustment | If true this credit note is a tax adjustment. |

        | IsApproved | If true this credit note is approved. |

        | Notes | The notes associated to the credit note. |

        | IsForClosingCustomer | If true this credit note is for closing a customer. |

        | WriteOffReasonListItem | The GUID and writeoff reason of the credit note. |

        | AccountingPeriodListItem | The GUID and accounting period of the credit note. |

        | ReasonListItem | The GUID and reason of the credit note. |

        | DepartmentListItem | The GUID and department of the credit note. |

        | OutletListItem | The GUID and outlet of the credit note. |

        | ReceivedDate | The received date of the credit note. |

        | InputDate | The input date of the credit note. |

        | ExportedDate | The exported date of the credit note. |

        | Amount | The object where the amount is specified. |

        | Amount.ExchangeRate | The object where the exchange rate of the amount is specified. |

        | Amount.ExchangeRate.Rate | The exchange rate of the amount. |

        | Amount.ExchangeRate.ExchangeDate | The exchange date in ISO format of the exchange rate. |

        | Amount.ExchangeRate.BaseCurrencyListItem | The GUID and base currency of the exchange rate. |

        | Amount.ExchangeRate.ExchangeCurrencyListItem | The GUID and exchange currency of the exchange rate. |

        | Amount.Amount | The amount of the credit note. |

        | Amount.BaseAmount | The base amount of the credit note. |

        | RelatedLocationInvoiceGuid | Used to filter the related invoice location guid associated to the invoice of the credit note. |

        | PrintAddress | The object where the print address is specified. |

        | PrintAddress.HouseNumber | The house number of the print address. |

        | PrintAddress.Address1 till 5 | The 5 address lines of the print address. |

        | PrintAddress.Postcode | The postcode of the print address. |

        | Details[0] | A list of objects containing credit note details. |

        | Details[0].SiteName | The site name of the credit note detail. |

        | Details[0].SiteAddress | The object where the site address of the credit note detail is specified. |

        | Details[0].SiteAddress.HouseNumber | The house number of the site address of the credit note detail. |

        | Details[0].SiteAddress.Address1 till 5 | The 5 address lines of the site address of the credit note detail. |

        | Details[0].SiteAddress.Postcode | The postcode of the site address of the credit note detail. |

        | Details[0].Reference | An alternative name used for the credit note detail. |

        | Details[0].ServiceListItem | The GUID and service of the credit note detail. |

        | Details[0].ActionListItem | The GUID and action of the credit note detail. |

        | Details[0].ContainerTypeListItem | The GUID and container type of the credit note detail. |

        | Details[0].MaterialTypeListItem | The GUID and material type of the credit note detail. |

        | Details[0].OutletListItem | The GUID and outlet of the credit note detail. |

        | Details[0].DepartmentListItem | The GUID and department of the credit note detail. |

        | Details[0].StartDate | The start date of the credit note detail in ISO format (YYYY-MM-DD). |

        | Details[0].EndDate | The end date of the credit note detail in ISO format (YYYY-MM-DD). |

        | Details[0].Quantity | The quantity of the credit note detail. |

        | Details[0].Volume | The volume of the credit note detail. |

        | Details[0].NetWeight | The net weight of the credit note detail. |

        | Details[0].Amount | The amount of the credit note detail. |

        | Details[0].AmountIncVAT | The amount including VAT of the credit note detail.'
      operationId: CreditNote_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorCreditNoteResource'
