dress lines of the site address of the credit note detail.| Yes      |\r\n| Details[0].SiteAddress.Postcode| The postcode of the site address of the credit note detail.| Yes      |\r\n| Details[0].Reference| An alternative name used for the credit note detail.| No       |\r\n| Details[0].ServiceListItem| The GUID and service of the credit note detail.| Yes      |\r\n| Details[0].ActionListItem| The GUID and action of the credit note detail.| Yes      |\r\n| Details[0].ContainerTypeListItem| The GUID and container type of the credit note detail.| No       |\r\n| Details[0].MaterialTypeListItem| The GUID and material type of the credit note detail.| No       |\r\n| Details[0].OutletListItem| The GUID and outlet of the credit note detail.| Yes      |\r\n| Details[0].DepartmentListItem| The GUID and department of the credit note detail.| Yes      |\r\n| Details[0].StartDate| The start date of the credit note detail in ISO format (YYYY-MM-DD).| No       |\r\n| Details[0].EndDate| The end date of the credit note detail in ISO format (YYYY-MM-DD).| No       |\r\n| Details[0].Quantity| The quantity of the credit note detail.| Yes      |\r\n| Details[0].Volume| The volume of the credit note detail.| No       |\r\n| Details[0].NetWeight| The net weight of the credit note detail.| No       |\r\n| Details[0].Amount| The amount of the credit note detail.| Yes      |\r\n| Details[0].AmountIncVAT| The amount including VAT of the credit note detail.| Yes      |\r\n| Details[0].RelatedInvoiceDetailGuid| The GUID associated to the invoice detail of the credit note detail.| No       |\r\n| Details[0].Notes| The notes associated to the credit note detail.| No       |\r\n| Details[0].IsDeleted| Whether the credit note detail is deleted.| No       |\r\n| Details[0].GUID| The GUID of the credit note detail.| No       |\r\n| Allocations[0].Amount| The amount of the invoice credit note.| No       |\r\n| Allocations[0].DateInput| The date input of the invoice credit note.| No       |\r\n| Allocations[0].RelatedInvoiceGuid| The GUID associated to the invoice of the credit note.| No       |\r\n| Allocations[0].AccountingPeriodListItem| The GUID and accounting period of the invoice credit note.| No       |\r\n| Allocations[0].IsDeleted| Whether the invoice credit note is deleted.| No       |\r\n| Allocations[0].GUID| The GUID of the invoice credit note.| No       |\r\n| Deallocations[0].Amount| The amount of the deallocated invoice.| No       |\r\n| Deallocations[0].DateDeallocated| The date of invoice credit note deallocation.| No       |\r\n| Deallocations[0].DateInput| The date input of the invoice credit note.| No       |\r\n| Deallocations[0].IsDeleted| Whether the invoice credit note is deleted.| No       |\r\n| Deallocations[0].RelatedUserDeallocatedByGuid| The GUID associated to the user who deallocated the invoice.| No       |\r\n| Deallocations[0].RelatedCreditNoteAllocationGuid| The GUID associated to the invoice credit note.| No       |\r\n| Deallocations[0].RelatedInvoiceGuid| The GUID associated to the invoice.| No       |\r\n| Deallocations[0].AllocationAccountingPeriodListItem| The GUID and description of allocation accounting period.| No       |\r\n| Deallocations[0].DeallocationAccountingPeriodListItem| The GUID and description of deallocation accounting period.| No       |\r\n| Deallocations[0].GUID| The GUID of the invoice credit note deallocation.| No       |\r\n| RelatedInvoiceGuidFilter| Used to filter the related invoice guid associated to the invoice of the credit note.| No         |\r\n| RelatedInvoiceDetailGuidFilter| Used to filter the related invoice detail guid associated to the invoice detail of the credit note detail.| No       |\r\n| RelatedUserDeallocatedByGuidFilter| Used to filter the related user guid associated to the invoice credit note deallocation.| No       |\r\n| RelatedCreditNoteAllocationGuidFilter| Used to filter the related invoice credit note guid associated to the invoice credit note deallocation.| No      