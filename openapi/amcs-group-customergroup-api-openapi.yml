openapi: 3.0.1
info:
  title: Core AccessGroup CustomerGroup API
  version: core
tags:
- name: CustomerGroup
paths:
  /lists/customerGroups/{guid}:
    get:
      tags:
      - CustomerGroup
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the customer group                                |\r\n| Description               | The description of the customer group                                    |\r\n| IsDeleted                 | Whether the customer group is deleted            |"
      operationId: CustomerGroup_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorCustomerGroupResource]'
  /lists/customerGroups:
    get:
      tags:
      - CustomerGroup
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the customer group                                |\r\n| Description               | The description of the customer group                                    |\r\n| IsDeleted                 | Whether the customer group is deleted            |"
      operationId: CustomerGroup_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorCustomerGroupResource]'
