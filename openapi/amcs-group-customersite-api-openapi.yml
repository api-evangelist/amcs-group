openapi: 3.2.0
info:
  description: '**Download Trux JSON**


    ---


    # Getting Started


    ## Document Purpose and Scope


    The VisionAI REST API endpoints are technically described in this document.'
  title: External Customer Site API
  version: external
servers:
- url: https://o1-dev-svc-core.amcsplatform.com/
  description: AMCS VisionAI Developer Environment
security:
- cookieAuth: []
tags:
- name: CustomerSite
paths:
  /visionai/api/integrator/customerSites:
    post:
      tags:
      - CustomerSite
      summary: Create or Update a Customer Site
      description: '# Create or Update a Customer Site


        | Parameter | Type | Description |

        | -------------------| -------- | ------------------------------------------------------------------------- |

        | CustomerSiteId | GUID | ID of the Customer Site |

        | Name | string | Display name of the Customer Site (Customer Name) |

        | Country | string | Address part |

        | City | string | Address part |

        | Street | string | Address part |

        | Address1 | string | Address part |

        | Address2 | string | Address part |

        | Address3 | string | Address part |

        | Address4 | string | Additional address part |

        | Address5 | string | Additional address part |

        | PostalCode | string | Address part |

        | HouseNumber | string | Address part |

        | Latitude | double | Geographic coordinate |

        | Longitude | double | Geographic coordinate |

        | OutletId | GUID | ID of the Company Outlet associated with the Customer Site |

        | IsDeleted | bool | Indicates if the Customer Site is no longer in use |

        | SiteType | string | Type of the site |

        | CustomerType | string | Type of the customer |


        ## Sample API Requests


        ```

        {

        "CustomerSiteId": "B3E43C4D-BC76-4E59-9E2E-25BC33EA2EC4",

        "Name": "Alterwerth Group",

        "Country": "United States",

        "City": "Upper Marlboro",

        "Street": "Trent Oval",

        "PostalCode": "MD 20792",

        "HouseNumber": "1762",

        "Address1": "Building A",

        "Address2": "Suite 5",

        "Address3": "Near Landmark Mall",

        "Address4": "PO Box 123",

        "Address5": "Additional Info",

        "Latitude": 38.82000560748161,

        "Longitude": -76.75000011205616,

        "OutletId": "2FAD788D-A748-4520-9120-923DA1E42942",

        "IsDeleted": false,

        "SiteType": "",

        "CustomerType": ""

        }

        ```'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.IoT.Contamination.Api.Integrator.CustomerSite.ApiCustomerAddress'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      operationId: postVisionaiApiIntegratorCustomerSites
      x-operation-id-source: derived
components:
