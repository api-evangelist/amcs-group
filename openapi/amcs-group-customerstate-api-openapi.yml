openapi: 3.0.1
info:
  title: Core AccessGroup CustomerState API
  version: core
tags:
- name: CustomerState
paths:
  /lists/customerStates/{guid}:
    get:
      tags:
      - CustomerState
      summary: Find with GUID
      description: "| Property                  | Description                                                            |\r\n| ------------------------- | ---------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the customer state                              |\r\n| Description               | The description of the customer state                                  |\r\n| IsDeleted                 | Whether the customer state is deleted        |"
      operationId: CustomerState_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorCustomerStateResource]'
  /lists/customerStates:
    get:
      tags:
      - CustomerState
      summary: Find with Filters
      description: "| Property                  | Description                                                            |\r\n| ------------------------- | ---------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the customer state                              |\r\n| Description               | The description of the customer state                                  |\r\n| IsDeleted                 | Whether the customer state is deleted        |"
      operationId: CustomerState_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorCustomerStateResource]'
components:
  schemas:
    ApiResourceResultEntity[ApiIntegratorCustomerStateResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorCustomerStateResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorCustomerStateResource:
      type: object
      properties:
        Description:
          type: string
        IsDeleted:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultCollection[ApiIntegratorCustomerStateResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorCustomerStateResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
