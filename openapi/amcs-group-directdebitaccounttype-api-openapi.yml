openapi: 3.0.1
info:
  title: Core AccessGroup DirectDebitAccountType API
  version: core
tags:
- name: DirectDebitAccountType
paths:
  /lists/directDebitAccountTypes/{guid}:
    get:
      tags:
      - DirectDebitAccountType
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the direct debit account type   |\r\n| Description            | The Description of the direct debit account type   |"
      operationId: DirectDebitAccountType_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorDirectDebitAccountTypeResource]'
  /lists/directDebitAccountTypes:
    get:
      tags:
      - DirectDebitAccountType
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the direct debit account type   |\r\n| Description            | The Description of the direct debit account type   |"
      operationId: DirectDebitAccountType_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorDirectDebitAccountTypeResource]'
