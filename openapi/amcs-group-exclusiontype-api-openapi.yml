openapi: 3.0.1
info:
  title: Core AccessGroup ExclusionType API
  version: core
tags:
- name: ExclusionType
paths:
  /lists/exclusionTypes/{guid}:
    get:
      tags:
      - ExclusionType
      summary: Find with GUID
      description: "| Property                  | Description|\r\n| ------------------------- | ------------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the exclusion type.|\r\n| Description               | The description of the exclusion type.                                    |\r\n"
      operationId: ExclusionType_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorExclusionTypeResource]'
  /lists/exclusionTypes:
    get:
      tags:
      - ExclusionType
      summary: Find with Filters
      description: "| Property                  | Description|\r\n| ------------------------- | ------------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the exclusion type.|\r\n| Description               | The description of the exclusion type.                                    |\r\n"
      operationId: ExclusionType_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorExclusionTypeResource]'
components:
  schemas:
    ApiResourceResultCollection[ApiIntegratorExclusionTypeResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorExclusionTypeResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorExclusionTypeResource:
      type: object
      properties:
        Description:
          type: string
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntity[ApiIntegratorExclusionTypeResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorExclusionTypeResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
