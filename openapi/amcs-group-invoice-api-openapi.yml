- name: Invoice
paths:
  /accounting/invoices/changes:
    get:
      tags:
      - Invoice
      summary: Retrieve changes
      description: '| Property | Description |

        | -------------- | ------------------------------------------------------------ |

        | GUID | The GUID associated to the invoice. |

        | RelatedCustomerGuid | The GUID associated to the customer of to the invoice. |

        | InvoiceNumber | The invoice number associated to the invoice. Filterable. |

        | CustomerInvoiceNumber | The customer invoice number associated to the invoice. |

        | AccountingPeriodListItem | The GUID and name of the accounting period associated to the invoice. |

        | InvoiceCycleListItem | The GUID and name of the invoice cycle associated to the invoice. |

        | RebateInvoiceCycleListItem | The GUID and name of the rebate invoice cycle associated to the invoice. |

        | VATExemptNumber | The VAT exempt number associated to the invoice. |

        | OutletListItem | The GUID and name of the company outlet associated to the invoice. |

        | DepartmentListItem | The GUID and name of the department associated to the invoice. |

        | IsCash | The isCash boolean associated to the invoice. |

        | IsAccepted | The isAccepted boolean associated to the invoice. |

        | IsDebit | The isDebit boolean associated to the invoice. |

        | IsRebilled | The isRebilled boolean associated to the invoice. |

        | IsTaxAdjustment | The isTaxAdjustment boolean associated to the invoice. |

        | IsRequestForPayment | The isRequestForPayment boolean associated to the invoice. |

        | InputDate | The input date and time associated to the invoice in ISO format (YYYY-MM-DD). Filterable. |

        | InvoiceDate | The invoice date and time associated to the invoice in ISO format (YYYY-MM-DD). Filterable. |

        | DueDate | The due date and time associated to the invoice in ISO format (YYYY-MM-DD). |

        | WriteOffReasonListItem | The GUID and name of the writeoffReason associated to the invoice. |

        | ExchangeRate | The exchange rate associated to the invoice. |

        | Rate | The rate associated to the invoice. |

        | ExchangeDate | The exchange date associated to the invoice in ISO format (YYYY-MM-DD). |

        | BaseCurrencyListItem | The GUID and name of the base currency associated to the invoice. |

        | ExchangeCurrencyListItem | The GUID and name of the exchange currency associated to the invoice. |

        | RelatedOrderGuid| Used to filter the related site guid associated to the details. |

        | RelatedWeighingGuid| Used to filter the related weighing guid associated to the details. |

        | RelatedWeighingInGuid| Used to filter the related weighing in guid associated to the details. |

        | RelatedWeighingOutGuid| Used to filter the related weighing out guid associated to the details. |

        | RelatedJobGuid| Used to filter the related job guid associated to the details. |

        | RelatedSiteGuid| Used to filter the related site guid associated to the details. |

        | RelatedRouteVisitGuid| Used to filter the related route visit guid associated to the details. |

        | RelatedPONumberGuidFilter| Used to filter the related PO Number guid associated to the details. |

        | RelatedRouteVisitJobGuid| Used to filter the related route visit job guid associated to the details. |

        | ReferenceFilter| Used to filter the reference associated to the details. |

        | RelatedBatchGuid| Used to filter the related batch associated to the invoice. |

        | RelatedUserGeneratedGuid| Used to filter the related user generated guid associated to the batch. |

        | RelatedUserAcceptedByGuid| Used to filter the related user acceptedby guid associated to the batch. |

        | RelatedInvoiceAllocatedToGuidFilter| Used to filter the related invoice guid associated to the invoice bill dealloaction. |

        | RelatedUserDeallocatedByGuidFilter| Used to filter the related user guid associated to the invoice bill deallocation.|

        | Amount | The amount associated to the invoice. |

        | BaseAmount | The base amount associated to the invoice. |

        | RelatedLocationGuid| Used to filter the related location guid associated to the invoice. |

        | PrintAddress | The print address object associated to the invoice. |

        | PrintAddress.HouseNumber | The house number associated to the print address.'
      operationId: Invoice_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorInvoiceResource'
