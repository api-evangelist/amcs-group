openapi: 3.0.1
info:
  title: Core AccessGroup InvoiceFrequency API
  version: core
tags:
- name: InvoiceFrequency
paths:
  /lists/invoiceFrequencies/{guid}:
    get:
      tags:
      - InvoiceFrequency
      summary: Find with GUID
      description: "| Property                  | Description|\r\n| ------------------------- | ------------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the invoice frequency                              |\r\n| Description               | The description of the invoice frequency                                  |\r\n| IsDeleted                 | Whether the invoice frequency is deleted       |"
      operationId: InvoiceFrequency_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorInvoiceFrequencyResource]'
  /lists/invoiceFrequencies:
    get:
      tags:
      - InvoiceFrequency
      summary: Find with Filters
      description: "| Property                  | Description|\r\n| ------------------------- | ------------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the invoice frequency                              |\r\n| Description               | The description of the invoice frequency                                  |\r\n| IsDeleted                 | Whether the invoice frequency is deleted       |"
      operationId: InvoiceFrequency_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorInvoiceFrequencyResource]'
