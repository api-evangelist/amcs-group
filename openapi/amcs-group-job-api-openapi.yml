openapi: 3.2.0
info:
  title: Amcs Group Job API
  version: '1.0'
  description: 'Operations tagged Job across 2 of this provider''s published API definitions: amcs-group-core-openapi-original.json, amcs-group-erp-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://ete-p5-tst-svc-core.amcsplatform.com/erp/api/integrator/erp
tags:
- name: Job
