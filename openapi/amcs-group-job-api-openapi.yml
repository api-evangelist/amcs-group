e material sale slot.| Yes |\r\n| MaterialSaleSlots[0].Notes| The notes associated to the job.| No |\r\n| MaterialSaleSlots[0].RelatedBookingSlotGuid| The guid of booking slot associated to the material sale slot.| No |\r\n| MaterialSaleSlots[0].RelatedCustomerGuid | The guid of customer associated to the material sale slot.| No |\r\n| MaterialSaleSlots[0].IsSchedule| The Schedule of material sale slots associated to the job.| Yes |\r\n| MaterialSaleSlots[0].IsManuallyAssigned| The IsManuallyAssigned of material sale slots associated to the job.| Yes |\r\n| MaterialSaleSlots[0].IsDeleted| Whether the material sale slot is deleted.| Yes |\r\n| MaterialSaleSlots[0].Guid| The GUID associated to the material sale slot.| No |\r\n| MaterialSaleSlotSlotNumberFilter |  Used to filter on the material sale slot slot number. | No |\r\n| MaterialSaleSlotGuidFilter | Used to filter on the material sale slot guid. | No |\r\n| MaterialSaleSlotRelatedBookingSlotGuidFilter | Used to filter on the material sale slot related booking slot guid. | No |\r\n| MaterialSaleSlotRelatedCustomerGuidFilter | Used to filter on the material sale slot related customer guid. | No |\r\n| PriorityListItem| The GUID and description of the priority associated to the job. | No |\r\n| DriverFeedback| The driver feedback associated to the job. | No |\r\n\r\n**Extra validations**\r\n\r\n| Condition | Error message |\r\n| --------- | ------------- |\r\n| Both Tag and SerialNo are null | Tag Or Serial Number: Must be entered. |\r\n| VisitDetails.HoursChargeable is changed on update | VisitDetails.HoursChargeable is a read-only property. |\r\n| ContainerDetails.Delivered is not null and ContainerDetails.Delivered.ContainerTypeListItem is not null | ContainerDetails.Delivered.ContainerTypeListItem is a read-only property. |\r\n| ContainerDetails.Removed is not null and ContainerDetails.Removed.ContainerTypeListItem is not null | ContainerDetails.Removed.ContainerTypeListItem is a read-only property. |\r\n| RejectedReasonListItem is not in one of the following reason categories: Callout Rejects, Lift Problem, Job Scheduled for Unexpected Day, Reject Schedule, Job Cancelled | RejectedReasonListItem must be in one of the following reason categories: Callout Rejects, Lift Problem, Job Scheduled for Unexpected Day, Reject Schedule, Job Cancelled. |\r\n| Job access times cannot overlap | Job.Access.StartTime and Job.Access.EndTime cannot overlap. |\r\n| RelatedBlobJobDocketPdfHashes[0].Hash is not null for Update and the Job did not have RelatedBlobJobDocketPdfHashes initially | Failed to save/update Job because RelatedBlobJobDocketPdfHashes do not exist for the Job. |\r\n| RelatedBlobJobDocketPdfHashes[0].Hash is not null for Update and Invalid Hash | Could not find JobDocketOutput matching template. |\r\n| If the GUID passed to VATIntendedListItem has a value that is not in the VAT table OR is deleted | Failed to save/update Job because The supplied VAT is not valid. The update has been rejected. Change the VATIntendedListItem to the Guid of a valid and undeleted VAT. |\r\n| If the RequiredEndTime is before RequiredStartTime | Failed to save/update Job because RequiredEndTime should not be before RequiredStartDate. |\r\n| If action type belongs to container job(Container Exchange, Container Repair , Container Remove) | RelatedSiteOrderItemGuid is required. |\r\n| If action type belongs to container job(Container Drop) OR scheduled job(Drop) | RelatedSiteOrderItemGuid is not required. |\r\n| If updating any created jobs | RelatedSiteOrderItemGuid should not be changed as it is readonly field while updating. |\r\n| If Action or ContainerType or Material changed on PriceOverrides PUT | Failed to save. Job with PriceOverrides cannot be set if Action or ContainerType or Material are changed. |\r\n| ActionListItem or ContainerTypeListItem is not valid for job prices | Failed to save/update Job because related SiteOrder does not have prices for given Action and ContainerType. |\r\n| If ServiceListItem is changed or not null | ServiceListItem.Guid is a read-only property. |\r\n| If the GUID passed to ActionListItem has a value that is not in the Action table OR is deleted | Failed to save/update Job because the supplied Action is not valid. The update has been rejected. Change the ActionListItem to the Guid of a valid and undeleted Action |\r\n| If the GUID passed to LastChangeReasonListItem has a value that is deleted | The provided LastChangeReasonListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If an Invalid value for JobPriceBreakdownTypeEnum is provided | An invalid JobPriceBreakdownType was provided. Could not action the request. Please provide one of the following values: Collected,LeftOnSite |\r\n| If the Breakdowns provided do not match the PriceOverrides | The Breakdowns and PriceOverrides do not match. The resource could not be created/updated. Ensure that Breakdowns.Guid references a Breakdowns of PriceOverrides. |\r\n| If LinkedJobs.IsDeleted is null | The mandatory property LinkedJobs.IsDeleted has a null value. The request could not be processed. Supply a value for the LinkedJobs.IsDeleted property of the submitted resource. |\r\n| If LinkedJobs.IsDeleted is true | IsDeleted is TRUE. Could not process the request. LinkedJobs can not be deleted via the REST API. |\r\n| If RelatedCreatedByUserGuid is changed on update | RelatedCreatedByUserGuid is a read-only property. |\r\n| If RelatedWTNBlobHashes array value is being edited | RelatedWTNBlobHashes is a read-only property. |\r\n| If RelatedWTNBlobHashes Guid is duplicate | The Guid must be unique per RelatedWTNBlobHashes |\r\n| If DeleteReasonGuid has value but IsDeleted is not set to true | Failed to save/update Job because DeleteReasonGuid property has been set, therefore IsDeleted property must be set to true. |\r\n| Deleting a job that is already completed | Job could not be deleted if job is completed. |\r\n| Deleting a job when Job is assigned to a weighing | This job is assigned to a weighing. This job cannot be deleted. |\r\n| Deleting a job if the job type is Container Jobs and is sent to mobile | Failed to save/update because Job (TicketNo) could not be deleted, as it is scheduled. |\r\n| Cancelling a job if the job type is Container Jobs and is sent to mobile | Failed to save/update because Job (TicketNo) could not be cancelled, as it is scheduled. |\r\n| Deleting a job when DeleteReasonGuid is not from 'Delete Job' reason category | Invalid DeleteReasonGuid. Reason must be from 'Delete Job' reason category. |\r\n| Cancelling a job when CancelledReasonListItem.Guid is not from 'Job Cancelled' reason category | Invalid CancelledReasonListItem. Reason must be from 'Job Cancelled' reason category. |\r\n| Cancelling and deleting a job | Failed to save/update Job. Job with CancelledReasonListItem cannot be set if DeletedReasonGuid is set. |\r\n| Updating a cancelled job | Failed to save/update Job. Job could not be updated, as it is Cancelled. |\r\n| If DriverFeedback is more than 1000 characters long | Failed to save/update Job because DriverFeedback must be no more than 1000 characters long. |"
