  /transport/jobs/changes:
    get:
      tags:
      - Job
      summary: Retrieve changes
      description: '| Property| Description|

        | ---------------------------------------------------------| -------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | GUID| The GUID associated to the job.|

        | DeleteRouteAssignmentsOnCompletion| Whether to delete route assignments on completion of the job.|

        | InProgress| Is the job in progress?|

        | IsAdhoc| Is the job ad hoc?|

        | IsCompleted| Is the job completed?Filterable.|

        | CompletedDate| The completed date of the job|

        | IsConfirmed| Is the job confirmed?|

        | IsExternalTransport| Is the job using external transport?|

        | IsFinanciallyConfirmed| Is the job financially confirmed?|

        | IsHazardousPaperworkComplete| Is the hazardous paperwork complete?|

        | IsScheduledTransfer| Is the job a scheduled transfer?|

        | IsWarranty| Is the job a warranty?|

        | IsDeleted| Whether to delete the job|

        | DeleteReasonGuid| The GUID of delete reason|

        | RelatedPONumberGuid| The GUID of related PONumber associated to the job.'
      operationId: Job_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorJobResource'
    servers:
    - url: https://ete-p5-tst-svc-core.amcsplatform.com/erp/api/integrator/erp
  /transport/jobs/{guid}:
