      x-summary-source: derived
      operationId: getJobsystemJobsById
      x-operation-id-source: derived
    put:
      tags:
      - Job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResourceId'
