| ContainerDetails.Delivered.SerialNo| The delivered container serial number.| Yes |\r\n| ContainerDetails.Delivered.Tag| The delivered container tag.| Yes |\r\n| ContainerDetails.Removed| The container removed from the job.| No |\r\n| ContainerDetails.Removed.RelatedContainerGuid| The GUID of the container removed from the job.| No |\r\n| ContainerDetails.Removed.ContainerTypeListItem | The GUID and description of the container type removed from to the job. | No |\r\n| ContainerDetails.Removed.Notes| The removed container notes.| No |\r\n| ContainerDetails.Removed.SerialNo| The removed container serial number.| Yes |\r\n| ContainerDetails.Removed.Tag| The removed container tag.| Yes |\r\n| VisitDetails| The visit details object associated to the job.| No |\r\n| VisitDetails.DriverNotes| The driver notes on the visit associated to the job.| No |\r\n| VisitDetails.TimeInCustomerSite| The time in on the visit associated to the job.| No |\r\n| VisitDetails.TimeOutCustomerSite| The time out on the visit associated to the job.| No |\r\n| VisitDetails.HoursChargeable| The hours chargeable on the visit associated to the job.| No |\r\n| VisitDetails.HoursNotChargeable| The hours not chargeable on the visit associated to the job.| No |\r\n| CustomerOrderNo| The customer order number associated to the job.| No |\r\n| DateRequired| The date the job is required.| Yes |\r\n| HazardousLoadReference| The hazardous load reference associated to the job.| No |\r\n| ManualTicketNo| The manual ticket number associated to the job.| No |\r\n| Notes| The notes associated to the job. Editable.| No |\r\n| PONumber| The PO number associated to the job.| No |\r\n| Quantity| The quantity associated to the job.| No |\r\n| ReleaseNumber| The release number associated to the job.| No |\r\n| TicketNo| The ticket number associated to the job.| No |\r\n| RejectedReasonListItem| The GUID and description of the job rejection reason. | No |\r\n| RelatedLocationDestinationGuid| The GUID of the destination location associated with the job.| Yes |\r\n| RelatedPictureBlobHashes| The array of related blob hashes and descriptions associated to the job.| No |\r\n| RelatedPictureBlobHashes[0].Description| The description of the blob.| No |\r\n| RelatedPictureBlobHashes[0].Hash| The hash of the blob to be used against the /blob endpoint. Files are provided as an octet stream which will need to be converted. | No |\r\n| PriceOverrides| The array of price overrides associated to the job.| No |\r\n| PriceOverrides[0].RelatedPriceGuid| The GUID of the price associated to the job price override.| Yes |\r\n| PriceOverrides[0].OverrideRate| The override rate associated to the job price override.| No |\r\n| PriceOverrides[0].Guid| The GUID associated to the job price override.| No |\r\n| PriceOverrides[0].IsSelected| The price isselected associated to the job price override.| Yes |\r\n| PriceOverrides[0].Breakdowns| The array of price breakdowns associated to the job price.| No |\r\n| PriceOverrides[0].Breakdowns[0].Guid| The GUID associated to the price breakdown.| No |\r\n| PriceOverrides[0].Breakdowns[0].IsDeleted| Whether the price breakdown is deleted.| No |\r\n| PriceOverrides[0].Breakdowns[0].FillLevel| The fill level associated to the price breakdown.| Yes |\r\n| PriceOverrides[0].Breakdowns[0].Quantity| The quantity associated to the price breakdown.| Yes |\r\n| PriceOverrides[0].Breakdowns[0].IsReceived| Whether the price breakdown is received.| Yes |\r\n| PriceOverrides[0].Breakdowns[0].Barcode| The BarCode associated to the price breakdown.| No |\r\n| PriceOverrides[0].Breakdowns[0].JobPriceBreakdownTypeEnum| The Job Price Breakdown Type associated to the price breakdown.| Yes |\r\n| RelatedPriceGuidFilter| Used to filter on the related price GUID.| No |\r\n| RelatedBlobJobDocketPdfHashes| The array of related job docket blob hashes. | No |\r\n| RelatedBlobJobDocketPdfHashes[0].Hash| The hash of the job docket blob to be used against the /blob endpoint. Files are provided as an octet stream which will need to be converted. | No |\r\n| RelatedWTNBlobHashes| The array of related waste transfer note blob hashes. | No |\r\n| RelatedWTNBlobHashes[0].Guid| The guid of the job waste transfer note blob.| No |\r\n| RelatedWTNBlobHashes[0].Hash| The hash of the job waste transfer note blob to be used against the /blob endpoint. Files are provided as an octet stream which will need to be converted. | No |\r\n| VATIntendedListItem| The GUID and description (code + rate) of the VAT associated to the job.| No |\r\n| RequiredStartTime| The start time at which the job is required.| No |\r\n| RequiredEndTime| The end time at which the job is required.| No |\r\n| ServiceListItem| The GUID and description of the Service associated to the job.| No |\r\n| LastChangeReasonListItem| The GUID and description of the last change reason associated to the job. | No |\r\n| LinkedJobs| The array of linked jobs associated to the job.| No  |\r\n| LinkedJobs[0].Guid| The guid of the linked job-job associated to the job.| No  |\r\n| LinkedJobs[0].IsDeleted| Whether the linked job-job is deleted.| Yes |\r\n| LinkedJobs[0].RelatedJobGuid| The guid of the linked job associated to the job.| Yes |\r\n| Position| The position associated to the job.| No |\r\n| RelatedCreatedByUserGuid| The created by sys user guid associated to the job.| No |\r\n| MaterialSaleSlots| The array of material sale slots associated to the job.| No |\r\n| MaterialSaleSlots[0].SlotNumber| The slot number associated to the jobmaterial sale slot.| Yes |\r\n| MaterialSaleSlots[0].SlotDate| The slot date associated to the job material sale slot.| Yes |\r\n| MaterialSaleSlots[0].SlotTime| The slot time associated to the job material sale slot.| No |\r\n| MaterialSaleSlots[0].CompanyOutletListItem    | The GUID and description of the CompanyOutlet associated to the material sale slot. | Yes |\r\n| MaterialSaleSlots[0].MaterialListItem| The GUID and description of the Material associated to the material sale slot.| Yes |\r\n| MaterialSaleSlots[0].Notes| The notes associated to the job.| No |\r\n| MaterialSaleSlots[0].RelatedBookingSlotGuid| The guid of booking slot associated to the material sale slot.| No |\r\n| MaterialSaleSlots[0].RelatedCustomerGuid | The guid of customer associated to the material sale slot.| No |\r\n| MaterialSaleSlots[0].IsSchedule| The Schedule of material sale slots associated to the job.| Yes |\r\n| MaterialSaleSlots[0].IsManuallyAssigned| The IsManuallyAssigned of material sale slots associated to the job.| Yes |\r\n| MaterialSaleSlots[0].IsDeleted| Whether the material sale slot is deleted.| Yes |\r\n| MaterialSaleSlots[0].Guid| The GUID associated to the material sale slot.| No |\r\n| MaterialSaleSlotSlotNumberFilter |  Used to filter on the material sale slot slot number. | No |\r\n| MaterialSaleSlotGuidFilter | Used to filter on the material sale slot guid. | No |\r\n| MaterialSaleSlotRelatedBookingSlotGuidFilter | Used to filter on the material sale slot related booking slot guid. | No |\r\n| MaterialSaleSlotRelatedCustomerGuidFilter | Used to filter on the material sale slot related customer guid. | No |\r\n| PriorityListItem| The GUID and description of the priority associated to the job. | No |\r\n| DriverFeedback| The driver feedback associated to the job. | No |\r\n\r\n**Extra validations**\r\n\r\n| Condition | Error message |\r\n| --------- | ------------- |\r\n| Both Tag and SerialNo are null | Tag Or Serial Number: Must be entered. |\r\n| VisitDetails.HoursChargeable is not null | VisitDetails.HoursChargeable is a read-only property. |\r\n| ContainerDetails.Delivered is not null and ContainerDetails.Delivered.ContainerTypeListItem is not null | ContainerDetails.Delivered.ContainerTypeListItem is a read-only property. |\r\n| ContainerDetails.Removed is not null and ContainerDetails.Removed.ContainerTypeListItem is not null | ContainerDetails.Removed.ContainerTypeListItem is a read-only property. |\r\n| RejectedReasonListItem is not in one of the following reason categories: Callout Rejects, Lift Problem, Job Scheduled for Unexpected Day, Reject Schedule, Job Cancelled | RejectedReasonListItem must be in one of the following reason categories: Callout Rejects, Lift Problem, Job Scheduled for Unexpected Day, Reject Schedule, Job Cancelled. |\r\n| Job access times cannot overlap | Job.Access.StartTime and Job.Access.EndTime cannot overlap. |\r\n| RelatedBlobJobDocketPdfHashes[0].Hash is not null for Insert | Failed to save Job because RelatedBlobJobDocketPdfHashes creation is not permitted. |\r\n| RelatedBlobJobDocketPdfHashes[0].Hash is not null for Update and the Job did not have RelatedBlobJobDocketPdfHashes initially | Failed to save/update Job because RelatedBlobJobDocketPdfHashes do not exist for the Job. |\r\n| RelatedBlobJobDocketPdfHashes[0].Hash is not null for Update and Invalid Hash | Could not find JobDocketOutput matching template. |\r\n| If the GUID passed to VATIntendedListItem has a value that is not in the VAT table OR is deleted | Failed to save/update Job because The supplied VAT is not valid. The update has been rejected. Change the VATIntendedListItem to the Guid of a valid and undeleted VAT. |\r\n| If the RequiredEndTime is before RequiredStartTime | Failed to save/update Job because RequiredEndTime should not be before RequiredStartDate. |\r\n| If action type belongs to container job(Container Exchange, Container Repair , Container Remove) | RelatedSiteOrderItemGuid is required. |\r\n| If action type belongs to container job(Container Drop) OR scheduled job(Drop) | RelatedSiteOrderItemGuid is not required. |\r\n| If updating any created jobs | RelatedSiteOrderItemGuid should not be changed as it is readonly field while updating. |\r\n| If Action or ContainerType or Material changed on PriceOverrides update | Failed to save. Job with PriceOverrides cannot be set if Action or ContainerType or Material are changed. |\r\n| ActionListItem or ContainerTypeListItem is not valid for job prices | Failed to save/update Job because related SiteOrder does not have prices for given Action and ContainerType. |\r\n| If ServiceListItem is not null | ServiceListItem.Guid: is not supported. |\r\n| If the GUID passed to ActionListItem has a value that is not in the Action table OR is deleted | Failed to save/update Job because the supplied Action is not valid. The update has been rejected. Change the ActionListItem to the Guid of a valid and undeleted Action |\r\n| If the GUID passed to LastChangeReasonListItem has a value that is deleted | The provided LastChangeReasonListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If an Invalid value for JobPriceBreakdownTypeEnum is provided on update | An invalid JobPriceBreakdownType was provided. Could not action the request. Please provide one of the following values: Collected,LeftOnSite |\r\n| If the Breakdowns provided do not match the PriceOverrides on update | The Breakdowns and PriceOverrides do not match. The resource could not be created/updated. Ensure that Breakdowns.Guid references a Breakdowns of PriceOverrides. |\r\n| If LinkedJobs.Guid is not null | LinkedJobs.Guid: is not supported. |\r\n| If LinkedJobs.IsDeleted is null | The mandatory property LinkedJobs.IsDeleted has a null value. The request could not be processed. Supply a value for the LinkedJobs.IsDeleted property of the submitted resource. |\r\n| If LinkedJobs.IsDeleted is true | IsDeleted is TRUE. Could not process the request. LinkedJobs can not be deleted via the REST API. |\r\n| Slot number already exists | Failed to save/update Job because the material sale slot that you are trying to save conflicts with an existing item. Each material sale slot must be unique in terms of SlotNumber. |\r\n| If RelatedWTNBlobHashes is not null for Insert | Failed to save Job because RelatedWTNBlobHashes creation is not permitted. |\r\n| If RelatedWTNBlobHashes array value is being edited | RelatedWTNBlobHashes is a read-only property. |\r\n| If RelatedWTNBlobHashes Guid is duplicate | The Guid must be unique per RelatedWTNBlobHashes |\r\n| If PriceOverrides[0].Guid is not null on insert | PriceOverrides.Guid: is not supported. |\r\n| If PriceOverrides[0]Breakdowns[0].Guid is not null on insert | PriceOverrides.Breakdowns.Guid: is not supported. |\r\n| If IsDeleted is true on insert | IsDeleted cannot be set to true on Create. |\r\n| If DeleteReasonGuid has value but IsDeleted is not set to true | Failed to save/update Job because DeleteReasonGuid property has been set, therefore IsDeleted property must be set to true. |\r\n| Deleting a job that is already completed | Job could not be deleted if job is completed. |\r\n| Deleting a job when Job is assigned to a weighing | This job is assigned to a weighing. This job cannot be deleted. |\r\n| Deleting a job if the job type is Container Jobs and is sent to mobile | Failed to save/update because Job (TicketNo) could not be deleted, as it is scheduled. |\r\n| Cancelling a job if the job type is Container Jobs and is sent to mobile | Failed to save/update because Job (TicketNo) could not be cancelled, as it is scheduled. |\r\n| Deleting a job when DeleteReasonGuid is not from 'Delete Job' reason category | Invalid DeleteReasonGuid. Reason must be from 'Delete Job' reason category. |\r\n| Cancelling a job when CancelledReasonListItem.Guid is not from 'Job Cancelled' reason category | Invalid CancelledReasonListItem. Reason must be from 'Job Cancelled' reason category. |\r\n| Deleting a job that is already cancelled | Failed to save/update Job. Job could not be updated, as it is Cancelled. |\r\n| CancelledReasonListItem is not null | CancelledReasonListItem is not supported on Create. |\r\n| DeleteReasonGuid is not null | DeleteReasonGuid is not supported on Create. |\r\n| If DriverFeedback is more than 1000 characters long | Failed to save/update Job because DriverFeedback must be no more than 1000 characters long. |"
