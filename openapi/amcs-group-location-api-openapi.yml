          type: string
        FaxNo:
          type: string
    ApiIntegratorLocationGeoResource:
      type: object
      properties:
        ZoneListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        ParcelBoundaryListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        Location:
          $ref: '#/components/schemas/ApiIntegratorLocationGeoLocationResource'
        Latitude:
          type: number
          format: double
        Longitude:
          type: number
          format: double
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiIntegratorLocationAddressResource:
      type: object
      properties:
        HouseNumber:
          type: string
        Address1:
          type: string
        Address2:
          type: string
        Address3:
          type: string
        Address4:
          type: string
        Address5:
          type: string
        Address6:
          type: string
        Address7:
          type: string
        Address8:
          type: string
        Address9:
          type: string
        Postcode:
          type: string
        ContactMethods:
          $ref: '#/components/schemas/ApiIntegratorLocationAddressContactMethodsResource'
        PostTownListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        RegionCodeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntity[ApiIntegratorLocationResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorLocationResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiIntegratorLocationGeoLocationResource:
