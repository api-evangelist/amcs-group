          format: double
        Long:
          type: number
          format: double
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
    ApiIntegratorLocationResource:
      type: object
      properties:
        Description:
          type: string
        Address:
          $ref: '#/components/schemas/ApiIntegratorLocationAddressResource'
        TimeZone:
          type: string
        LegalName:
          type: string
        Directions:
          type: string
        Geo:
          $ref: '#/components/schemas/ApiIntegratorLocationGeoResource'
        UniqueReference:
          type: string
        Acreage:
          type: number
          format: double
        IsDeleted:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
