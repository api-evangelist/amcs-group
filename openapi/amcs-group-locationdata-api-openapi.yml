openapi: 3.0.1
info:
  title: Core AccessGroup LocationData API
  version: core
tags:
- name: LocationData
paths:
  /udf/locationDatas/changes:
    get:
      tags:
      - LocationData
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: links
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges[ApiUdfLocationDataResource]'
  /udf/locationDatas/template:
