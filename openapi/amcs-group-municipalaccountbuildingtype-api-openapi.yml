tags:
- name: MunicipalAccountBuildingType
paths:
  /lists/municipalAccountBuildingTypes:
    get:
      tags:
      - MunicipalAccountBuildingType
      summary: Find with Filters
      description: '| Property | Description |

        | ------------------------- | --------------------------------------------------------------------------- |

        | GUID | The GUID associated to the municipal account building type |

        | Description | The description of the municipal account building type |

        | IsDeleted | Whether the municipal account building type is deleted |'
      operationId: MunicipalAccountBuildingType_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection_ApiIntegratorMunicipalAccountBuildingTypeResource'
components:
  schemas:
    ApiResourceStatus:
      type: object
      properties:
        id:
