openapi: 3.0.1
info:
  title: Core AccessGroup MunicipalAccountServicePackage API
  version: core
tags:
- name: MunicipalAccountServicePackage
paths:
  /municipal/municipalAccountServicePackages:
    get:
      tags:
      - MunicipalAccountServicePackage
      summary: Find with Filters
      operationId: MunicipalAccountServicePackage_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorMunicipalAccountServicePackageResource]'
components:
  schemas:
    ApiIntegratorMunicipalAccountServicePackageDetailServiceResource:
      type: object
      properties:
        ServiceType:
          type: string
        ServiceDescription:
          type: string
        ServiceLineDescription:
          type: string
        Material:
          type: string
        WorkOrderStatus:
          type: string
        OrderNumber:
          type: string
        OrderNumberGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollection[ApiIntegratorMunicipalAccountServicePackageResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorMunicipalAccountServicePackageResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorMunicipalAccountServicePackageDetailResource:
      type: object
      properties:
        Description:
          type: string
        Services:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorMunicipalAccountServicePackageDetailServiceResource'
    ApiIntegratorMunicipalAccountServicePackageResource:
      type: object
      properties:
        AccountGuidFilter:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        FunctionalIdFilter:
          type: string
        ServicePackages:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorMunicipalAccountServicePackageDetailResource'
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
