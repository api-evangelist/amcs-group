openapi: 3.0.1
info:
  title: Core AccessGroup MunicipalEventDetail API
  version: core
tags:
- name: MunicipalEventDetail
paths:
  /municipal/municipalEventDetails:
    get:
      tags:
      - MunicipalEventDetail
      summary: Find with Filters
      operationId: MunicipalEventDetail_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorMunicipalEventDetailResource]'
components:
  schemas:
    ApiIntegratorListItemResource:
      type: object
      properties:
        Description:
          type: string
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollection[ApiIntegratorMunicipalEventDetailResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorMunicipalEventDetailResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiIntegratorMunicipalCustomerSiteAreaResource:
      type: object
      properties:
        Description:
          type: string
        Latitude:
          type: number
          format: double
        Longitude:
          type: number
          format: double
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorMunicipalEventDetailResource:
      type: object
      properties:
        MunicipalAccount:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        Description:
          type: string
        StartDate:
          type: string
          format: dateTime
          example: '2000-01-01 00:00:00.000'
        StartTime:
          type: string
          format: dateTimeOffset
          example: '2000-01-01T00:00:00.0000000+01:00'
        EndDate:
          type: string
          format: dateTime
          example: '2000-01-01 00:00:00.000'
        EndTime:
          type: string
          format: dateTimeOffset
          example: '2000-01-01T00:00:00.0000000+01:00'
        Notes:
          type: string
        Material:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        ServicePoint:
          $ref: '#/components/schemas/ApiIntegratorMunicipalCustomerSiteAreaResource'
        MaterialGuidFilter:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
