          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity_ApiIntegratorOneOffActionResource'
    put:
      tags:
      - OneOffAction
      summary: Partial update
      description: '| Property| Description| Required |

