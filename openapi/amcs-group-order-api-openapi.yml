iver and  Sysuser must belongs to order companyoutlet or standingjob companyoutlet |\r\n| If vehicle is not belong to order companyoutlet or standingjob companyoutlet and vehicle containertype is not supported | Failed to save. StandingJobs with RelatedVehicleGuid of guid is not supported for SiteOrder StandingJobs. The vehicle must be linked with container type and vehicle must belongs to order companyoutlet or standingjob companyoutlet |\r\n| If DayOfWeekListItem is provided when IsNoPlannedDay set to true | Failed to save. StandingJobs with DayOfWeekListItem cannot be set if IsNoPlannedDay is set to true. |\r\n| If siteorder service is not IsCollection | RouteAssignments is not supported. Primary service in ServiceAgreement should have iscollection set to true. |\r\n| If site area is not linked with customer site | Failed to save. RouteAssignments with RelatedSiteAreaGuid of guid is not supported for SiteOrder Route Assignment. The given customer site area is not linked to the customer site of site order. |\r\n| If site area is deleted | Failed to save/update SiteOrder because the supplied CustomerSiteArea is not valid. The update has been rejected. Change the RouteAssignments.RelatedSiteAreaGuid to the Guid of a valid and undeleted CustomerSiteArea |\r\n| If the given action does not have action type of Assign To Round | Failed to save. ActionListItem.Guid is not supported for Route Assignment.The given actions should be linked with action type AssignToRound. |\r\n| If the given container type is not priced in the service agreement | Failed to save. ContainerTypeListItem.Guid is not supported for Route Assignment.The given container type should be in service agreement price. |\r\n| If DayOfWeekListItem is set when IsNoPlannedDate is true | Failed to save. DayOfWeekListItem cannot be set when IsNoPlannedDate is set to true |\r\n| If startDate is set when IsNoPlannedDate is true | Failed to save. StartDate cannot be set when IsNoPlannedDate is set to true |\r\n| If DayOfWeekListItem is null or empty when IsNoPlannedDate is false | Failed to save. DayOfWeekListItem cannot be null when IsNoPlannedDate is set to false |\r\n| If startDate is null or empty when IsNoPlannedDate is false | Failed to save. StartDate cannot be null when IsNoPlannedDate is set to false |\r\n| If position is set to 0 and relatedRouteTemplateGuid has a value | Failed to save. Position cannot be set to zero when relatedRouteTemplateGuid has a value |\r\n| If position has a value and relatedRouteTemplateGuid is null | Failed to save. Position cannot have a value if relatedRouteTemplateGuid is set to null |\r\n| If the company outlet passed is not related to the customer site | The Company Outlet and Customer Site do not match. The resource could not be created/updated. Ensure that CompanyOutletListItem.Guid references a Company Outlet of RelatedSiteGuid |\r\n| If the RouteAssignment is deleted in an order | Failed to save/update SiteOrder because the supplied RouteAssignment is not valid. The update has been rejected. Change the RouteAssignments to the Guid of a valid undeleted RouteAssignment |\r\n| If Containers[0].RelatedContainerGuid provided has a non-existent or deleted value | Failed to save/update SiteOrder because the supplied RelatedContainerGuid is not valid. The update has been rejected. Change the Containers[0].RelatedContainerGuid to the Guid of a valid and undeleted RelatedContainerGuid |\r\n| If Containers[0].ContainerTypeListItem.Guid is null | The mandatory property Containers[0].ContainerTypeListItem.Guid has a null value. The request could not be processed. Supply a value for the Containers[0].ContainerTypeListItem.Guid property of the submitted resource. |\r\n| If Containers[0].ContainerStateListItem.Guid provided is null | The mandatory property Containers[0].ContainerStateListItem.Guid has a null value. The request could not be processed. Supply a value for the Containers[0].ContainerStateListItem.Guid property of the submitted resource. |\r\n| If Containers[0].ContainerTypeListItem.Guid provided has a non-existent or deleted value | Failed to save/update SiteOrder because the supplied Containers[0].ContainerTypeListItem.Guid is not valid. The update has been rejected. Change the Containers[0].ContainerTypeListItem.Guid to the Guid of a valid and undeleted Containers[0].ContainerTypeListItem.Guid |\r\n| If Containers[0].ContainerStateListItem.Guid provided has a non-existent or deleted value | Failed to save/update SiteOrder because the supplied  Containers[0].ContainerStateListItem.Guid is not valid. The update has been rejected. Change the Containers[0].ContainerStateListItem.Guid to the Guid of a valid and undeleted Containers[0].ContainerStateListItem.Guid |\r\n| If Containers[0].ContainerStateListItem.Guid provided has an inactive value | Failed to save/update SiteOrder because the supplied  Containers[0].ContainerStateListItem.Guid is not valid. The update has been rejected. Change the Containers[0].ContainerStateListItem.Guid to the Guid of an active Containers[0].ContainerStateListItem.Guid |\r\n| If RouteAssignments[0].Exclusions[0].ExclusionTypeListItem.Guid provided with a mark as Deleted Exclusion Type | The provided  RouteAssignments[0].Exclusions[0].ExclusionTypeListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If RouteAssignments[0].Exclusions[0].ReasonListItem.Guid provided with a mark as Deleted Reason | The provided  RouteAssignments[0].Exclusions[0].ReasonListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If RouteAssignments[0].Exclusions[0].ReasonListItem is not in one of the following reason categories: Exclusions |  RouteAssignments[0].Exclusions[0].ReasonListItem must be in one of the following reason categories: Exclusions. |\r\n| If Valid Until date is provided on update and rentals/invoice is not created | Issue closing the order. Could not update the order and close it - {message} |\r\n| If the value for IsDeleted is changed on update | IsDeleted is a read-only property |\r\n| If the value for Containers.IsDeleted is changed on update | Containers.IsDeleted is a read-only property |\r\n| If the value for ItemRentals.IsDeleted is changed on update | ItemRentals.IsDeleted is a read-only property |\r\n| If the GUID passed to InspectionTypeListItem has a value that is deleted | The provided InspectionTypeListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If RouteCalloutRequests[0].MaxLiftQuantity is a negative number |  Failed to save/update MaxLiftQuantity because value must be non negative. |\r\n| If po number chain is not belong to customer | Failed to save. PONumberChain with RelatedPONumberChainGuid of guid is not supported for customer. The given PONumberChain must belongs to customer |\r\n"
