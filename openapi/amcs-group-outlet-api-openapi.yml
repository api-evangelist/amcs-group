      description: '# Create or Update an Outlet


        | Parameter | Type | Description |

        |-------------|--------|----------------------------------|

        | OutletId | GUID | ID of the Outlet |

        | OutletName | string | Display name |

        | IsDeleted | bool | Outlet is no longer in use |


        ## Sample API Requests


        ```

        {

        "OutletId": "B3E43C4D-BC76-4E59-9E2E-25BC33EA2EC4",

        "OutletName": "Primary Company Outlet",

        "IsDeleted": false

        }

        ```'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.IoT.Contamination.Api.Integrator.Outlet.ApiOutlet'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
