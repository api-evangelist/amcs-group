info:
  title: Amcs Group Outlet API
  version: '1.0'
  description: 'Operations tagged Outlet across 3 of this provider''s published API definitions: amcs-group-erp-openapi-original.json, amcs-group-scale-openapi-original.json, amcs-group-visionai-openapi-original.json. Each path carries the servers of the definition it was published in.'
