  description: AMCS VisionAI Developer Environment
tags:
- name: Outlet
paths:
  /lists/outlets/{guid}:
    get:
      tags:
      - Outlet
      summary: Find with GUID
      description: '| Property | Description|

        | ------------------------- | ----------------------------------------------------------------------------- |

        | GUID | The GUID associated to the outlet|

        | Description | The description of the outlet|

        | IsDeleted | Whether the outlet is deleted |

        | AbbreviatedDescription | The abbreviated description of the outlet|

        | AnalysisCode | The analysis code of the outlet|

        | CompanyListItem | The GUID and description of the company|

        | OutletTypeListItem | The GUID and description of the outlet type (various values)|

        | Address | The address object of the outlet|

        | Address.HouseNumber | The house number of the address object of the outlet|

        | Address.Address1 | The Address1 of the address object of the outlet|

        | Address.Address2 | The Address2 of the address object of the outlet|

        | Address.Address3 | The Address3 of the address object of the outlet|

        | Address.Address4 | The Address4 of the address object of the outlet|

        | Address.Address5 | The Address5 of the address object of the outlet|

        | Address.Postcode | The Postcode of the address object of the outlet|

        | DepartmentListItems| The GUID and description of departments associated to the outlet|

        | VATRegistrationNumber | The VAT Registration Number of the outlet|

        | RelatedLocationGuid | The RelatedLocationGuid of the outlet. Filterable|

        | AcceptedMaterials[]| The materials accepted of the outlet|

        | AcceptedMaterials[].MaterialListItem| The materialListItem of the materials accepted for the outlet|

        | AcceptedMaterials[].WarnOnMinimumLoad| The WarnOnMinimumLoad of the materials accepted for the outlet|

        | AcceptedMaterials[].MinimumLoadWeight| The MinimumLoadWeight of the materials accepted for the outlet|

        | AcceptedMaterials[].IsDeleted | Whether the materials accepted for the outlet is deleted|

        | AcceptedMaterials[].GUID | The GUID of the materials accepted for the outlet|

        | AnalysisCodes| The list of company outlet analysis codes associated to the outlet.|

        | AnalysisCodes[0].Guid| The guid associated to the company outlet analysis code.|

        | AnalysisCodes[0].Description| The Description of the company outlet analysis code.|

        | AnalysisCodes[0].IsDeleted| Whether the company outlet analysis code is deleted.|'
      operationId: Outlet_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity_ApiIntegratorCompanyOutletResource'
    servers:
    - url: https://ete-p5-tst-svc-core.amcsplatform.com/erp/api/integrator/erp
