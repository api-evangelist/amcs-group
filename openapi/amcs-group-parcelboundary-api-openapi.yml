openapi: 3.0.1
info:
  title: Core AccessGroup ParcelBoundary API
  version: core
tags:
- name: ParcelBoundary
paths:
  /lists/parcelBoundaries/{guid}:
    get:
      tags:
      - ParcelBoundary
      summary: Find with GUID
      description: "| Property                  | Description                                                                 |\r\n| ------------------------- | --------------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the parcel boundary                                  |\r\n| ParcelNo                | The value associated to the parcel number                                   |\r\n| GeoJSON                   | A coordinates polygon which outlines the coordinates of the parcel boundary |"
      operationId: ParcelBoundary_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorParcelBoundaryResource]'
  /lists/parcelBoundaries:
    get:
      tags:
      - ParcelBoundary
      summary: Find with Filters
      description: "| Property                  | Description                                                                 |\r\n| ------------------------- | --------------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the parcel boundary                                  |\r\n| ParcelNo                | The value associated to the parcel number                                   |\r\n| GeoJSON                   | A coordinates polygon which outlines the coordinates of the parcel boundary |"
      operationId: ParcelBoundary_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorParcelBoundaryResource]'
components:
  schemas:
    ApiResourceResultEntity[ApiIntegratorParcelBoundaryResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorParcelBoundaryResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorParcelBoundaryResource:
      type: object
      properties:
        GeoJSON:
          type: string
        ParcelNo:
          type: string
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceResultCollection[ApiIntegratorParcelBoundaryResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorParcelBoundaryResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
