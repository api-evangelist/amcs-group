        | IsAutoAllocated | Whether the payment is auto allocated, null by default. |

        | AccountingPeriodListItem | The GUID and description of the accounting period of the payment. |

        | Allocations | The list of allocations associated to the payment. |

        | Allocations[0].Guid | The GUID associated to the allocation. |

        | Allocations[0].Amount | The Amount associated to the allocation. |

        | Allocations[0].DateInput | The DateInput associated to the allocation. |

        | Allocations[0].AccountingPeriodListItem | The GUID and descriptopn of the accounting period associated to the allocation. |

        | Allocations[0].RelatedInvoiceGuid | The GUID associated to the invoice of the allocation. |

        | Deallocations | The list of deallocations associated to the payment. |

        | Deallocations[0].Guid | The GUID associated to the deallocation. |

        | Deallocations[0].Amount | The amount associated to the deallocation. |

        | Deallocations[0].DateInput | The date input associated to the deallocation. |

        | Deallocations[0].DateDeallocated | The date deallocated associated to the deallocation. |

        | Deallocations[0].AllocationAccountingPeriodListItem | The GUID and descriptopn of the allocation accounting period associated to the deallocation. |

        | Deallocations[0].DeallocationAccountingPeriodListItem | The GUID and descriptopn of the deallocation accounting period associated to the deallocation. |

        | Deallocations[0].RelatedInvoiceGuid | The GUID associated to the invoice of the deallocation. |

        | Deallocations[0].RelatedUserDeallocatedByGuid | The GUID associated to the sysuser of the deallocation. |

        | RelatedInvoiceGuidFilter | Used to filter by the related invoice GUID. |

        | RelatedJobGuids | The list of job GUIDs associated to the payment. |

        | RelatedSysUserGuid | The GUID associated to the sys user of the payment. Filterable. |

        | RelatedJobGuids[0].RelatedJobGuid | The GUID associated to the job. |

        | AccountingPeriodBadListItem | The GUID and description of the bad accounting period of the payment. |

        | ReasonBadListItem | The GUID and description of the bad reason of the payment. |

        | PaymentTransactions | The list of Payment Transactions associated to the payment. |

        | PaymentTransactions[0].Guid| The guid associated to the payment transaction. |

        | PaymentTransactions[0].IsDeleted| Whether the payment transaction is deleted. |

        | PaymentTransactions[0].CardType| The CardType associated to the payment transaction. |

        | PaymentTransactions[0].MaskedCardNumber| The MaskedCardNumber associated to the payment transaction. |

        | PaymentTransactions[0].DateReceived| The DateReceived associated to the payment transaction. |

        | PaymentTransactions[0].PaymentReference| The PaymentReference associated to the payment transaction. |

        | PaymentTransactions[0].Reference| The Reference associated to the payment transaction.'
