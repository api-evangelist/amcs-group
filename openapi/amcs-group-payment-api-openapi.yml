          type: string
        ResultMessage:
          type: string
        Notes:
          type: string
        ResponseCode:
          type: string
        CurrencyCode:
          type: string
        Amount:
          type: number
          format: double
        AmountRefundable:
          type: number
          format: double
        PaymentProviderListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        PaymentPointListItem:
