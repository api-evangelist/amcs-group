openapi: 3.0.1
info:
  title: Core AccessGroup PickupInterval API
  version: core
tags:
- name: PickupInterval
paths:
  /lists/pickupIntervals/{guid}:
    get:
      tags:
      - PickupInterval
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the pickup interval   |\r\n| Description               | The description of the pickup interval   |\r\n| NoOfDays| Total number of days of interval   |\r\n| NoOfMonths                | Total number of month of interval   |\r\n| IsWeekly| Whether the pickup interval is weekly   |\r\n| IsMonthly| Whether the pickup interval is monthly   |"
      operationId: PickupInterval_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorPickupIntervalResource]'
  /lists/pickupIntervals:
    get:
      tags:
      - PickupInterval
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the pickup interval   |\r\n| Description               | The description of the pickup interval   |\r\n| NoOfDays| Total number of days of interval   |\r\n| NoOfMonths                | Total number of month of interval   |\r\n| IsWeekly| Whether the pickup interval is weekly   |\r\n| IsMonthly| Whether the pickup interval is monthly   |"
      operationId: PickupInterval_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorPickupIntervalResource]'
