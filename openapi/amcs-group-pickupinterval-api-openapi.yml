          type: string
        NoOfDays:
          type: integer
          format: int32
        NoOfMonths:
          type: integer
          format: int32
        IsWeekly:
          type: boolean
        IsMonthly:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceErrors:
