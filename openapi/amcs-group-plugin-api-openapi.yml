openapi: 3.2.0
info:
  title: Core Plugin API
  version: core
tags:
- name: Plugin
paths:
  /services/api/plugins/update:
    put:
      tags:
      - Plugin
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
      responses:
        '200':
          description: Success
      summary: Replace services api plugins update
      x-summary-source: derived
      operationId: putServicesApiPluginsUpdate
      x-operation-id-source: derived
  /plugins/update:
    put:
      tags:
      - Plugin
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.PluginData.Data.IPluginAction'
      responses:
        '200':
          description: Success
      summary: Replace plugins update
      x-summary-source: derived
      operationId: putPluginsUpdate
      x-operation-id-source: derived
  /services/api/plugins/run-ui-component:
    post:
      tags:
      - Plugin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.Data.Entity.Workflow.ShowScreenActivityRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.Data.Entity.Workflow.ShowScreenActivityRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.Data.Entity.Workflow.ShowScreenActivityRequest'
      responses:
        '200':
          description: Success
      summary: Create services api plugins run ui component
      x-summary-source: derived
      operationId: postServicesApiPluginsRunUiComponent
      x-operation-id-source: derived
  /plugins/run-ui-component:
    post:
      tags:
      - Plugin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AMCS.Data.Entity.Workflow.ShowScreenActivityRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AMCS.Data.Entity.Workflow.ShowScreenActivityRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AMCS.Data.Entity.Workflow.ShowScreenActivityRequest'
      responses:
        '200':
          description: Success
      summary: Create plugins run ui component
      x-summary-source: derived
      operationId: postPluginsRunUiComponent
      x-operation-id-source: derived
components:
  schemas:
    AMCS.PluginData.Data.IPluginAction:
      type: object
      additionalProperties: false
    AMCS.Data.Entity.Workflow.ShowScreenActivityRequest:
      type: object
      properties:
        callbackUrl:
          type:
          - string
          - 'null'
        parameters: {}
        name:
          type:
          - string
          - 'null'
        userContext:
          type:
          - string
          - 'null'
        allowedActions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
