openapi: 3.0.1
info:
  title: Core AccessGroup PriceModifier API
  version: core
tags:
- name: PriceModifier
paths:
  /lists/priceModifiers/{guid}:
    get:
      tags:
      - PriceModifier
      summary: Find with GUID
      description: "| Property                  | Description                                                       |\r\n| ------------------------- | ----------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the pricemodifier                          |\r\n| Description               | The description of the pricemodifier                              |"
      operationId: PriceModifier_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorPriceModifierResource]'
  /lists/priceModifiers:
    get:
      tags:
      - PriceModifier
      summary: Find with Filters
      description: "| Property                  | Description                                                       |\r\n| ------------------------- | ----------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the pricemodifier                          |\r\n| Description               | The description of the pricemodifier                              |"
      operationId: PriceModifier_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorPriceModifierResource]'
