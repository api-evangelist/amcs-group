openapi: 3.0.1
info:
  title: Core AccessGroup Priority API
  version: core
tags:
- name: Priority
paths:
  /lists/priorities/{guid}:
    get:
      tags:
      - Priority
      summary: Find with GUID
      description: "| Property                  | Description                                   |\r\n| ------------------------- | --------------------------------------------- |\r\n| GUID                      | The GUID associated to the priority|\r\n| Description               | The description of the priority|\r\n| IsDeleted                 | Whether the priority is deleted            |\r\n   "
      operationId: Priority_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorPriorityResource]'
  /lists/priorities:
    get:
      tags:
      - Priority
      summary: Find with Filters
      description: "| Property                  | Description                                   |\r\n| ------------------------- | --------------------------------------------- |\r\n| GUID                      | The GUID associated to the priority|\r\n| Description               | The description of the priority|\r\n| IsDeleted                 | Whether the priority is deleted            |\r\n   "
      operationId: Priority_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorPriorityResource]'
components:
  schemas:
    ApiResourceResultCollection[ApiIntegratorPriorityResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorPriorityResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorPriorityResource:
      type: object
      properties:
        Description:
          type: string
        IsDeleted:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceResultEntity[ApiIntegratorPriorityResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorPriorityResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
