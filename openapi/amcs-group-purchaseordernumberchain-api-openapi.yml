        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity_ApiIntegratorPurchaseOrderNumberChainResource'
    put:
      tags:
      - PurchaseOrderNumberChain
      summary: Partial update
      description: '| Property| Description| Required |

        | --------------------------------- | ------------------------------------------------------------------------------------- | -------- |

        | GUID| The GUID associated to the purchase order number chain.| No |

        | RelatedCustomerGuid| The GUID associated to the customer of the purchase order number chain.| Yes |

        | Description| The description of the purchase order number chain.| Yes |

        | StartDate| The start date of the purchase order number chain.| Yes |

        | EndDate| The end date of the purchase order number chain.| Yes |

        | IsDeleted| Whether the purchase order number chain is deleted.| No |

        | PONumbers| The list of purchase order numbers associated to the purchase order number chain.| No |

        | PONumbers[0].Guid| The GUID associated to the purchase order number.| No |

        | PONumbers[0].PONumber | The purchase order number associated to the purchase order number.| No |

        | PONumbers[0].StartDate| The start date associated to the purchase order number.| Yes |

        | PONumbers[0].EndDate| The end date associated to the purchase order number.| Yes |

        | PONumbers[0].Amount| The amount associated to the purchase order number.| Yes |

        | PONumbers[0].AmountTypeListItem | The GUID and description of the amount type associated to the purchase order number.| Yes |

        | PONumbers[0].IsDeleted| Whether the purchase order number is deleted.| No |

        | RelatedPONumberGuidFilter| Used to filter on the related purchase order number GUID.| No |

        | RelatedPONumberFilter| Used to filter on the related purchase order number.| No |


        **Extra validations**


        | Condition | Error message |

        | --------- | ------------- |

        | If RelatedCustomerGuid is changed. | Relationship between PONumberChain and Customer cannot be updated |

        | Unique description for PONumberChain | Failed to save/update PONumberChain because the PO Number Chain that you are trying to save conflicts with an existing item. Each PO Number Chain must be unique in terms of Description. |

        | PONumbers date out of range. | Start and end dates are outside the PO number chain dates. |

        | PONumbers date overlap. | Start and end dates overlap an existing PO number. |

        | PONumbers.Guid should link with PONumberChain | Failed to save. PONumberChain with PONumbers.Guid of [value] cannot be set if PONumbers.Guid is not related to PONumberChain. |

        | If IsDeleted is changed. | IsDeleted is a read-only property. |

        | If PONumber.IsDeleted is changed. | PONumber.IsDeleted is a read-only property. |'
      operationId: PurchaseOrderNumberChain_Update
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegratorPurchaseOrderNumberChainResource'
        required: true
        x-bodyName: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
