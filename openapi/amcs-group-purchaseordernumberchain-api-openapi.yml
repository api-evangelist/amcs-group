paths:
  /accounting/purchaseOrderNumberChains/changes:
    get:
      tags:
      - PurchaseOrderNumberChain
      summary: Retrieve changes
      description: '| Property| Description|

        | --------------------------------- | ------------------------------------------------------------------------------------- |

        | GUID| The GUID associated to the purchase order number chain.|

        | RelatedCustomerGuid| The GUID associated to the customer of the purchase order number chain. Filterable.|

        | Description| The description of the purchase order number chain. Filterable.|

        | StartDate| The start date of the purchase order number chain.|

        | EndDate| The end date of the purchase order number chain.|

        | IsDeleted| Whether the purchase order number chain is deleted.|

        | PONumbers| The list of purchase order numbers associated to the purchase order number chain.|

        | PONumbers[0].Guid| The GUID associated to the purchase order number.|

        | PONumbers[0].PONumber | The purchase order number associated to the purchase order number.|

        | PONumbers[0].StartDate| The start date associated to the purchase order number.|

        | PONumbers[0].EndDate| The end date associated to the purchase order number.|

        | PONumbers[0].Amount| The amount associated to the purchase order number.|

        | PONumbers[0].AmountTypeListItem | The GUID and description of the amount type associated to the purchase order number.|

        | PONumbers[0].IsDeleted| Whether the purchase order number is deleted.|

        | RelatedPONumberGuidFilter| Used to filter on the related purchase order number GUID.|

        | RelatedPONumberFilter| Used to filter on the related purchase order number.|'
      operationId: PurchaseOrderNumberChain_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorPurchaseOrderNumberChainResource'
