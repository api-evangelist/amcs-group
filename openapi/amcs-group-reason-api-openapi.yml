openapi: 3.0.1
info:
  title: Core AccessGroup Reason API
  version: core
tags:
- name: Reason
paths:
  /lists/reasons/{guid}:
    get:
      tags:
      - Reason
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the reason                               |\r\n| Description               | The description of the reason                   |\r\n| FullDescription           | The full description of the reason                                   |\r\n| AnalysisCode              | The analysis code of the reason                       |\r\n| ReasonCategoryListItem    | The GUID and reason category of the reason (various values)              |\r\n| IsDeleted                 | Whether the reason is deleted    |"
      operationId: Reason_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorReasonResource]'
  /lists/reasons:
    get:
      tags:
      - Reason
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the reason                               |\r\n| Description               | The description of the reason                   |\r\n| FullDescription           | The full description of the reason                                   |\r\n| AnalysisCode              | The analysis code of the reason                       |\r\n| ReasonCategoryListItem    | The GUID and reason category of the reason (various values)              |\r\n| IsDeleted                 | Whether the reason is deleted    |"
      operationId: Reason_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorReasonResource]'
components:
  schemas:
    ApiIntegratorReasonResource:
      type: object
      properties:
        Description:
          type: string
        IsDeleted:
          type: boolean
        FullDescription:
          type: string
        AnalysisCode:
          type: string
        ReasonCategoryListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorListItemResource:
      type: object
      properties:
        Description:
          type: string
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultEntity[ApiIntegratorReasonResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorReasonResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceResultCollection[ApiIntegratorReasonResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorReasonResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
