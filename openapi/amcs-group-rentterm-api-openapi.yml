openapi: 3.0.1
info:
  title: Core AccessGroup RentTerm API
  version: core
tags:
- name: RentTerm
paths:
  /lists/rentTerms/{guid}:
    get:
      tags:
      - RentTerm
      summary: Find with GUID
      description: "| Property                  | Description                                                      |\r\n| ------------------------- | ---------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the rent term.                            |\r\n| Description| The description of the rent term.        |\r\n"
      operationId: RentTerm_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorRentTermResource]'
  /lists/rentTerms:
    get:
      tags:
      - RentTerm
      summary: Find with Filters
      description: "| Property                  | Description                                                      |\r\n| ------------------------- | ---------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the rent term.                            |\r\n| Description| The description of the rent term.        |\r\n"
      operationId: RentTerm_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorRentTermResource]'
components:
  schemas:
    ApiResourceResultCollection[ApiIntegratorRentTermResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorRentTermResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultEntity[ApiIntegratorRentTermResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorRentTermResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorRentTermResource:
      type: object
      properties:
        Description:
          type: string
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
