        | DayOfOccurrenceInMonthListItem| The GUID and description of the Day of Occurrence in month associated to the routeAssignment.| No |

        | RelatedRouteTemplateGuid| The GUID of the RelatedRouteTemplate associated to the routeAssignment.| No |

        | Position| The position associated to the routeAssignment.| No |

        | StartDate| The start date associated to the routeAssignment. | No |

        | EndDate| The end date associated to the routeAssignment.| No |

        | RequestedBy| Who is the routeAssignment requested by?| No |

        | Notes| The notes associated to the routeAssignment.| No |

        | MaxLiftQuantity| The max lift quantity associated to the routeAssignment.| No |

        | MinLiftQuantity| The min lift quantity associated to the routeAssignment.| No |

        | RequiresQuantity| Does the routeAssignment require quantity?| No |

        | IsGpsAutoMatchingDisabled| Is the GPS auto matching disabled for the routeAssignment?| No |

        | IsNoPlannedDate| Is there no planned date for the routeAssignment?| No |

        | IsNoBinOnSiteExcluded| Is the bin on site excluded for the routeAssignment? | No |

        | RelatedContainerGuid| The RelatedContainerGuid associated to the routeAssignment.| No |

        | AccessTimes[0]| A list of objects containing route assignment access time.| No |

        | AccessTimes[0].Guid | The GUID associated to the route assignment access time.| No |

        | AccessTimes[0].AccessContact | The access contact name to associated route assignment.| No |

        | AccessTimes[0].AccessNotes | The access notes to associated route assignment.| No |

        | AccessTimes[0].FromExclusion | The exclusion fo access to associated route assignment.| Yes |

        | AccessTimes[0].AccessStartTime | The access start time to associated route assignment.| Yes |

        | AccessTimes[0].AccessEndTime | The access end time to associated route assignment.| Yes |

        | AccessTimes[0].DayOfWeekListItem | The GUID and description of the day of week to access.| Yes |

        | Details[0] | A list of objects containing route assignment details.| No |

        | Details[0].Guid | The GUID associated to the route assignment details.| No |

        | Details[0].PlannedQuantity | The planned quantity associated to the routeAssignment.| Yes |

        | Details[0].ContainerTypeListItem | The GUID and description of the ContainerType associated to the routeAssignment detail.| Yes |


        **Extra validations**


        | Condition | Error message |

        | --------- | ------------- |

        | If the DayOfOccurrenceInMonthListItem is not equal to the week of month of the StartDate | Failed to save Route Assignment. Start date must be associated to the correct DayOfOccurenceInMonthId |

        | If startDate and DayOfWeekListItem are set when IsNoPlannedDate is true | Failed to save Route Assignment. Start date and DayOfWeekListItem cannot be set when IsNoPlannedDate is true |

        | If the DayOfOccurrenceInMonthListItem has a value and PickUpInterval is Weekly/ Fortnightly/ Every Three Weeks or Every Four Weeks. | Failed to save Route Assignment. DayOfOccurrenceInMonthListItem cannot be set when PickupIntervalId is Weekly/ Fortnightly/ Every Three Weeks or Every Four Weeks |

        | If position is set to 0 and relatedRouteTemplateGuid has a value | Failed to save Route Assignment.'
      operationId: RouteAssignment_Update
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegratorRouteAssignmentResource'
        required: true
        x-bodyName: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
