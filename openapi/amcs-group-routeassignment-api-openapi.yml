components:
  schemas:
    ApiIntegratorListItemResource:
      type: object
      properties:
        Description:
          type: string
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollection[ApiIntegratorRouteAssignmentResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorRouteAssignmentResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiIntegratorRouteAssignmentDetailResource:
      type: object
      properties:
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        ContainerTypeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        PlannedQuantity:
          type: number
          format: double
    ApiResourceId:
      type: object
      properties:
        resource:
          type: string
          format: uuid
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiIntegratorRouteAssignmentAccessTimeResource:
      type: object
      properties:
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        AccessContact:
          type: string
        AccessNotes:
          type: string
        FromExclusion:
          type: boolean
        AccessStartTime:
          type: string
          format: zonedDateTime
          example:
            DateTime: '2000-01-01'
            TimeZone: Europe/London
        AccessEndTime:
          type: string
          format: zonedDateTime
          example:
            DateTime: '2000-01-01'
            TimeZone: Europe/London
        DayOfWeekListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorRouteAssignmentResource:
      type: object
      properties:
        RelatedOrderGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        ActionListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        ContainerTypeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        PickupIntervalListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        DayOfWeekListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        DayOfOccurrenceInMonthListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        RelatedRouteTemplateGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        Position:
          type: integer
          format: int32
        StartDate:
          type: string
          format: localDate
          example: '2000-01-01'
        EndDate:
          type: string
          format: localDate
          example: '2000-01-01'
        RequestedBy:
          type: string
        Notes:
          type: string
        MaxLiftQuantity:
          type: integer
          format: int32
        MinLiftQuantity:
          type: integer
          format: int32
        RequiresQuantity:
          type: boolean
        IsGpsAutoMatchingDisabled:
          type: boolean
        IsNoPlannedDate:
          type: boolean
        IsNoBinOnSiteExcluded:
          type: boolean
        RelatedContainerGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        AccessTimes:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorRouteAssignmentAccessTimeResource'
        Details:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorRouteAssignmentDetailResource'
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntity[ApiIntegratorRouteAssignmentResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorRouteAssignmentResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
