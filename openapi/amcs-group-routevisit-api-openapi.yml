          type: integer
          format: int32
        IntendedPrice:
          type: number
          format: double
        IntendedVatListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        DriverNotes:
          type: string
        Notes:
          type: string
        Access:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorAccessArrayResource'
