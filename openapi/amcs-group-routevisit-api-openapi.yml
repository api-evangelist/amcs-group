          format: zonedDateTime
          example:
            DateTime: '2000-01-01'
            TimeZone: Europe/London
        EndTimeAccess:
          type: string
          format: zonedDateTime
          example:
            DateTime: '2000-01-01'
            TimeZone: Europe/London
        DayOfWeekId:
