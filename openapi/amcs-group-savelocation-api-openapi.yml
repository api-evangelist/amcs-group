openapi: 3.2.0
info:
  title: AMCS Platform REST Save Location API
  description: '![latest End points](/amcsrestapi/diagram/endpointslatest.svg)


    # Overview


    ## Who Should Read this Document


    This document contains a technical description of the AMCS Platform REST API. It is intended for:


    · System integrators


    · Customer IT team looking to integrate AMCS Platform with another system


    · Third parties looking to integrate their system with AMCS Platform


    ## Document Scope


    This document introduces the technical aspects of the AMCS Platform REST API. The purpose of this document is to provide readers with detail on how to:


    · Access the REST API


    · Make calls to the API to retrieve, append and update resources


    · Retrieve the incremental changes to a collection


    · Find more detail on the end points that are available from an environment. ## Summary


    AMCS Platform REST API is designed to support the integration of AMCS Platform with other systems. With care and additional infrastructure, the REST API can be used to build functionality on top of Platform but that is not it’s primary purpose. The ‘changes since’ process provides the main means of performing an initial synchronisation of the AMCS Platform and another system, and then keeping them synchronised. Methods are also provided to create and update resources. # Integration Patterns and Tools


    The AMCS Platform provides a number of tools that can be used to connect systems. Care should be taken to match the right tooling to the intended pattern of integration. · When an extract-based approach is needed, use BI reporting. · When derived values are require, use the data mart. · When business processes on different systems need to be integrated by synchronising the data on each through an event style interface, use the REST API. An integration using the REST API will need to take full responsibility for all aspects of the integration including:


    · Pulling change events from AMCS Platform


    · Filtering the changed resources for the ones that are of interest


    · Pulling additional resources from the REST API in order the retrieve all the properties needed by the destination


    · Mashing resources to create the complete view required


    · Translating that into the form required by the destination


    · Validating this to ensure it meet the entry rules of the destination


    · Pushing the result to the destination


    In the early stages of designing the interface care should be taken to ensure that the need for caching/staging has been considered. The changes since functionality is effectively a means of pulling create/change events from platform. The only filters available enable retrieval of related resources to build a view external to AMCS Platform


    # Basics


    The AMCS REST API provides a RESTful interface that allows access to the primary business resources of the AMCS platform. The interface follows general HATEOAS compliance principles. ## Quick start


    A quickstart walkthrough based on node.js and covering authentication and getting a page of customers can be found here. ## Interface definitions


    Swagger documentation for the end points available on an environment can be found at:


    Before 8.5: https://{environment domain name}/swagger/ui/index


    From 8.5: https://{environment domain name}/erp/api/swagger/ui/index


    ## HTTP Interface


    The following HTTP RESTful methods are provided as part of this API:


    · GET: Provides read access to retrieve details of one or more resources. · POST: Creates or updates a single resource or a set of resources. · PUT: Updates a single resource or a set of resources. Note:


    · DELETE methods are currently not provided as part of the API. The REST API URIs begin with


    https://{environment domain name}/erp/api/integrator/erp


    For example:

    https://prod.amcs-at-mycompany.com/erp/api/integrator/erp


    This should be used as the base of the URI.'
  version: latest
servers:
- url: https://ete-p5-tst-svc-core.amcsplatform.com/erp/api/integrator/erp
tags:
- name: SaveLocation
paths:
  /directory/saveLocations:
    post:
      tags:
      - SaveLocation
      summary: Create or update
      description: '| Property| Description| Required |

        | ----------------------------- | ------------------------------------------------------------------------------------------------------------- | -------- |

        | GUID| The GUID associated to the customer.| No |

        | Description| The description associated to the location.| Yes |

        | TimeZone| The TimeZone associated to the location.| No |

        | LegalName| The LegalName associated to the location.| No |

        | Directions| The Directions associated to the location.| No |

        | UniqueReference| The UniqueReference associated to the location.| No |

        | Acreage| The Acreage associated to the location.| No |

        | Address| The Address object associated to the location.| Yes |

        | Address.HouseNumber| The HouseNumber associated address object of the location.| No |

        | Address.Address1| The Address1 associated to the address object of the location.| No |

        | Address.Address2| The Address2 associated to the address object of the location.| No |

        | Address.Address3| The Address3 associated to the address object of the location.| No |

        | Address.Address4| The Address4 associated to the address object of the location.| No |

        | Address.Address5| The Address5 associated to the address object of the location.| No |

        | Address.Address6| The Address6 associated to the address object of the location.| No |

        | Address.Address7| The Address7 associated to the address object of the location.| No |

        | Address.Address8| The Address8 associated to the address object of the location.| No |

        | Address.Address9| The Address9 associated to the address object of the location.| No |

        | Address.Postcode| The Postcode associated to the address object of the location.| No |

        | Address.PostTownListItem| The GUID and post town associated to the address object of the location.| No |

        | Address.RegionCodeListItem| The GUID and region code associated to the address object of the location.| No |

        | Address.ContactMethods| The ContactMethods object associated to the address object of the location.| No |

        | Address.ContactMethods.TelNo| The telephone number object associated to the ContactMethods object of the address object of the location.| No |

        | Address.ContactMethods.FaxNo| The fax number object associated to the ContactMethods object of the address object of the location.| No |

        | Geo| The Geo object associated to the location.| No |

        | Geo.ZoneListItem| The GUID and description of the zone associated to the Geo object of the location.| No |

        | Geo.ParcelBoundaryListItem| The GUID and description of the parcel boundary associated to the Geo object of the location.| No |

        | Geo.Location| The location object associated to the Geo object of the location.| No |

        | Geo.Location.Lat| The latitude associated to the location object associated to the Geo object of the location.| No |

        | Geo.Location.Long| The longitude associated to the location object associated to the Geo object of the location.| No |

        | Geo.Latitude| The latitude associated to the Geo object of the location.| No |

        | Geo.Longitude| The longitude associated to the Geo object of the location.| No |

        | IsDeleted| Whether the location is deleted.| No |


        **Extra validations**


        | Condition| Error message |

        | ------------------------------------------------------------------------------------------------------------- | ------------- |

        | TimeZone has a value| TimeZone must be set to null. |

        | If IsDeleted true| IsDeleted is TRUE. Could not process the request. Resources can not be deleted via the REST API. |

        | If we attempt to delete a Location| An attempt has been made to set IsDeleted. The request could not be processed. Ensure that IsDeleted has default value. |

        | Geo.Location has a value| Geo.Location must be set to null. |

        | Geo.Latitude value not in range between -90 and 90 or Geo.Longitude value not in range between -180 and 180| Geo.Latitude value must be between -90 and 90. Geo.Longitude value must be between -180 and 180. |'
      operationId: SaveLocation_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegratorSaveLocationResource'
        required: true
        x-bodyName: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
  /directory/saveLocations/{guid}:
    put:
      tags:
      - SaveLocation
      summary: Partial update
      description: '| Property| Description| Required |

        | ----------------------------- | ------------------------------------------------------------------------------------------------------------- | -------- |

        | GUID| The GUID associated to the customer.| No |

        | Description| The description associated to the location.| Yes |

        | TimeZone| The TimeZone associated to the location.| No |

        | LegalName| The LegalName associated to the location.| No |

        | Directions| The Directions associated to the location.| No |

        | UniqueReference| The UniqueReference associated to the location.| No |

        | Acreage| The Acreage associated to the location.| No |

        | Address| The Address object associated to the location.| Yes |

        | Address.HouseNumber| The HouseNumber associated address object of the location.| No |

        | Address.Address1| The Address1 associated to the address object of the location.| No |

        | Address.Address2| The Address2 associated to the address object of the location.| No |

        | Address.Address3| The Address3 associated to the address object of the location.| No |

        | Address.Address4| The Address4 associated to the address object of the location.| No |

        | Address.Address5| The Address5 associated to the address object of the location.| No |

        | Address.Address6| The Address6 associated to the address object of the location.| No |

        | Address.Address7| The Address7 associated to the address object of the location.| No |

        | Address.Address8| The Address8 associated to the address object of the location.| No |

        | Address.Address9| The Address9 associated to the address object of the location.| No |

        | Address.Postcode| The Postcode associated to the address object of the location.| No |

        | Address.PostTownListItem| The GUID and post town associated to the address object of the location.| No |

        | Address.RegionCodeListItem| The GUID and region code associated to the address object of the location.| No |

        | Address.ContactMethods| The ContactMethods object associated to the address object of the location.| No |

        | Address.ContactMethods.TelNo| The telephone number object associated to the ContactMethods object of the address object of the location.| No |

        | Address.ContactMethods.FaxNo| The fax number object associated to the ContactMethods object of the address object of the location.| No |

        | Geo| The Geo object associated to the location.| No |

        | Geo.ZoneListItem| The GUID and description of the zone associated to the Geo object of the location.| No |

        | Geo.ParcelBoundaryListItem| The GUID and description of the parcel boundary associated to the Geo object of the location.| No |

        | Geo.Location| The location object associated to the Geo object of the location.| No |

        | Geo.Location.Lat| The latitude associated to the location object associated to the Geo object of the location.| No |

        | Geo.Location.Long| The longitude associated to the location object associated to the Geo object of the location.| No |

        | Geo.Latitude| The latitude associated to the Geo object of the location.| No |

        | Geo.Longitude| The longitude associated to the Geo object of the location.| No |

        | IsDeleted| Whether the location is deleted.| No |


        **Extra validations**


        | Condition| Error message |

        | ------------------------------------------------------------------------------------------------------------- | ------------- |

        | If TimeZone value has been changed| TimeZone is a read-only property |

        | If IsDeleted true| IsDeleted is TRUE. Could not process the request. Resources can not be deleted via the REST API. |

        | If we attempt to delete a Location| An attempt has been made to set IsDeleted. The request could not be processed. Ensure that IsDeleted has default value. |

        | If Geo.Location.Lat value has been changed| Geo.Location.Lat is a read-only property |

        | If Geo.Location.Long value has been changed| Geo.Location.Long is a read-only property |

        | Geo.Latitude value not in range between -90 and 90 or Geo.Longitude value not in range between -180 and 180| Geo.Latitude value must be between -90 and 90.'
      operationId: SaveLocation_Update
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegratorSaveLocationResource'
        required: true
        x-bodyName: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
components:
  schemas:
    ApiResourceId:
      type: object
      properties:
        resource:
          type: string
          format: uuid
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiIntegratorListItemResource:
      type: object
      properties:
        Description:
          type: string
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorLocationAddressContactMethodsResource:
      type: object
      properties:
        TelNo:
          type: string
        FaxNo:
          type: string
    ApiIntegratorLocationGeoLocationResource:
      type: object
      properties:
        Lat:
          type: number
          format: double
        Long:
          type: number
          format: double
    ApiIntegratorLocationAddressResource:
      type: object
      properties:
        HouseNumber:
          type: string
        Address1:
          type: string
        Address2:
          type: string
        Address3:
          type: string
        Address4:
          type: string
        Address5:
          type: string
        Address6:
          type: string
        Address7:
          type: string
        Address8:
          type: string
        Address9:
          type: string
        Postcode:
          type: string
        ContactMethods:
          $ref: '#/components/schemas/ApiIntegratorLocationAddressContactMethodsResource'
        PostTownListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        RegionCodeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorSaveLocationResource:
      type: object
      properties:
        Description:
          type: string
        Address:
          $ref: '#/components/schemas/ApiIntegratorLocationAddressResource'
        TimeZone:
          type: string
        LegalName:
          type: string
        Directions:
          type: string
        Geo:
          $ref: '#/components/schemas/ApiIntegratorLocationGeoResource'
        UniqueReference:
          type: string
        Acreage:
          type: number
          format: double
        IsDeleted:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorLocationGeoResource:
      type: object
      properties:
        ZoneListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        ParcelBoundaryListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        Location:
          $ref: '#/components/schemas/ApiIntegratorLocationGeoLocationResource'
        Latitude:
          type: number
          format: double
        Longitude:
          type: number
          format: double
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
