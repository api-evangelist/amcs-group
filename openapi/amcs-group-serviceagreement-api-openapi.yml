paths:
  /productCatalogue/serviceAgreements/changes:
    get:
      tags:
      - ServiceAgreement
      summary: Retrieve changes
      description: '| Property | Description |

        | -------------- | ------------------------------------------------------------ |

        | GUID| The GUID associated to the service agreement. |

        | Description| The description associated to the service agreement. |

        | StartDate| The start date associated to the service agreement in ISO format (YYYY-MM-DD). |

        | EndDate| The end date associated to the service agreement in ISO format (YYYY-MM-DD). |

        | ReviewDate| The review date associated to the service agreement in ISO format (YYYY-MM-DD). |

        | RelatedCustomerGuid| The GUID of the customer associated to the service agreement. Filterable. |

        | EndReasonListItem| The GUID and name of the end reason associated to the service agreement. |

        | InvoiceFrequencyListItem| The GUID and name of the invoice frequency associated to the service agreement. |

        | InvoiceCycleListItem| The GUID and name of the Invoice cycle associated to the service agreement. |

        | OutletListItem| The GUID and name of the outlet associated to the service agreement. |

        | PaymentTypeListItem| The GUID and name of the payment type associated to the service agreement. |

        | PaymentTermListItem| The GUID and name of the payment term associated to the service agreement. |

        | DepartmentListItem| The GUID and name of the department associated to the service agreement. |

        | PrimaryServiceListItem| The GUID and name of the primary service associated to the service agreement. |

        | IsDeleted| Whether the service agreement is deleted. |

        | Prices| The list of prices associated to the service agreement. |

        | Prices[0].PriceGuid| The GUID associated to the price related to the service agreement. |

        | Prices[0].ActionListItem| The GUID and name of the action associated to the price. |

        | Prices[0].ServiceListItem| The GUID and name of the service associated to the price. |

        | Prices[0].UnitOfMeasureListItem| The GUID and name of the unit of measurement associated to the price. |

        | Prices[0].DefaultActionExternalDescription | The default action external description of the price. |

        | Prices[0].SalesCode| The sales code of the price. |

        | Prices[0].CostCode| The cost code of the price. OBSOLETE |

        | Prices[0].PurchaseCode| The purchase code of the price. OBSOLETE |

        | Prices[0].ContainerTypeListItem| The GUID and name of the container type associated to the price. |

        | Prices[0].MaterialListItem| The GUID and name of the material associated to the price. |

        | Prices[0].MaterialClassListItem| The GUID and name of the material class associated to the price. |

        | Prices[0].PricingBasisListItem| The GUID and name of the pricing basis associated to the price. |

        | Prices[0].DateDeleted| The date deleted of the price. |

        | Prices[0].IsDeleted| Whether the price is deleted. |

        | Prices[0].Amount| The amount object associated to the price. |

        | Prices[0].Amount.Price| The price associated to the amount. |

        | Prices[0].Amount.Offset| The offset associated to the amount. |

        | Prices[0].Amount.Percentage| The percentage associated to the amount. |

        | Prices[0].Amount.FloorPrice| The floor price associated to the amount. |

        | Prices[0].Amount.CeilingPrice| The ceiling price associated to the amount. |

        | Prices[0].Amount.MinimumCharge| The minimum charge associated to the amount. |

        | Prices[0].Amount.Allowance| The allowance associated to the amount. |

        | Prices[0].Amount.VATListItem| The GUID and name of the VAT associated to the amount. |

        | Prices[0].Amount.IsRebate| Whether the price is rebate. |

        | Prices[0].LatePaymentFeeDefinition | The late payment fee definition associated to the price. |

        | Prices[0].LatePaymentFeeDefinition.Description | The description associated to the late payment fee definition. |

        | Prices[0].LatePaymentFeeDefinition.CustomerCategoryListItem | The GUID and description of the customer category associated to the late payment fee definition. |

        | Prices[0].LatePaymentFeeDefinition.LatePaymentFeeTypeListItem | The GUID and description of the late payment fee type associated to the late payment fee definition.'
      operationId: ServiceAgreement_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorServiceAgreementResource'
