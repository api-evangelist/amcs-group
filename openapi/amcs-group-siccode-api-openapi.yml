openapi: 3.0.1
info:
  title: Core AccessGroup SicCode API
  version: core
tags:
- name: SicCode
paths:
  /lists/sicCodes/{guid}:
    get:
      tags:
      - SicCode
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the sic code                                      |\r\n| Description2007           | The 2007 description of the sic code                                     |\r\n| Code2007                  | The 2007 sic code                                                        |    \r\n| Description2003           | The 2003 description of the sic code                                     |\r\n| Code2003                  | The 2003 sic code                                                        |\r\n| IsDeleted                 | Whether the sic code is deleted     |\r\n    "
      operationId: SicCode_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorSicCodeResource]'
  /lists/sicCodes:
    get:
      tags:
      - SicCode
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the sic code                                      |\r\n| Description2007           | The 2007 description of the sic code                                     |\r\n| Code2007                  | The 2007 sic code                                                        |    \r\n| Description2003           | The 2003 description of the sic code                                     |\r\n| Code2003                  | The 2003 sic code                                                        |\r\n| IsDeleted                 | Whether the sic code is deleted     |\r\n    "
      operationId: SicCode_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorSicCodeResource]'
components:
  schemas:
    ApiResourceErrors:
      type: object
      properties:
        errors:
          type: string
    ApiIntegratorSicCodeResource:
      type: object
      properties:
        Description2007:
          type: string
        Code2007:
          type: string
        Description2003:
          type: string
        Code2003:
          type: string
        IsDeleted:
          type: boolean
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceResultCollection[ApiIntegratorSicCodeResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorSicCodeResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultCollectionExtra:
      type: object
      properties:
        count:
          type: integer
          format: int32
    ApiResourceResultEntity[ApiIntegratorSicCodeResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorSicCodeResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultEntityExtra:
      type: object
      properties:
        expand:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: object
        include:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties:
                type: object
    ApiResourceResultEntityLinks:
      type: object
      properties:
        self:
          type: string
        associations:
          type: array
          items:
            type: string
        expand:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
