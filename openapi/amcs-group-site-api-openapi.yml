 remit location guid associated to the remit location of this site.|\r\n| RelatedLocationGuid| Used to filter the related location guid associated to the location of the site.|\r\n| RelatedTaxJurisdictionGuid| The GUID associated to the tax jurisdiction of this site. Filterable.|\r\n| AccessTimes[0]| A list of objects containing customer site access time.|\r\n| AccessTimes[0].Guid| The GUID associated to the site access time.|\r\n| AccessTimes[0].AccessContact| The access contact name to associated site.|\r\n| AccessTimes[0].AccessNotes| The access notes to associated site.|\r\n| AccessTimes[0].AccessStartTime| The access start time to associated site.|\r\n| AccessTimes[0].AccessEndTime| The access end time to associated site.|\r\n| AccessTimes[0].DayOfWeekListItem| The GUID and description of the day of week to access.|\r\n| DocumentDeliveryMethods[]| The array of document delivery types associated to the customer site.|\r\n| DocumentDeliveryMethods[0].DocumentDeliveryType| The GUID and description of the document delivery type associated to the DocumentDeliveryMethods. |\r\n| RelatedLocationDocumentGuid| Used to filter the related document location guid associated to this site.|\r\n| RelatedLocationStatementGuid| Used to filter the related statement location guid associated to this site.|\r\n| RelatedLocationQuotationGuid| Used to filter the related quotation location guid associated to this site.|\r\n| RelatedTradingNames[]| The array of customer trading names associated to the customer site.| \r\n| RelatedTradingNames[0].Guid| The guid associated to the customer trading name associated to the customer site.| \r\n| RelatedTradingNames[0].RelatedTradingNameGuid| The guid of the customer trading name associated to the customer site.| \r\n| RelatedTradingNames[0].Description| The description of customer trading name associated to the customer site.| \r\n| RelatedTradingNameGuidFilter| Used to filter on related trading name guid.| \r\n| Areas| A list of objects containing customer site area.|\r\n| Areas[0].Guid| The GUID associated to the customer site area.|\r\n| Areas[0].Description| The description associated to the customer site area.|\r\n| Areas[0].RelatedLocationGuid| The related location guid associated to the location of the customer site area.|\r\n| Areas[0].IsDeleted| Whether the customer site area is deleted.|\r\n| AreasGuidFilter| Used to filter the customer site area by GUID.|\r\n| AreasRelatedLocationGuidFilter| Used to filter the related location guid associated to the location of the customer site area.|\r\n| RelatedHealthAndSafetyBlobs| The array of related health and safety blobs to this site.|\r\n| RelatedHealthAndSafetyBlobs[0].Guid| The GUID associated to the RelatedHealthAndSafetyBlob.|\r\n| RelatedHealthAndSafetyBlobs[0].Hash| The hash of the external document blob to be used against the /blob endpoint. Files are provided as an octet stream which will need to be converted. |\r\n| RelatedHealthAndSafetyBlobs[0].DocumentName| The document name|\r\n| RelatedHealthAndSafetyBlobs[0].DocumentReference| The document reference|\r\n| RelatedHealthAndSafetyBlobs[0].ValidFrom| The valid from date|\r\n| RelatedHealthAndSafetyBlobs[0].ValidUntil| The valid until date|\r\n| RelatedHealthAndSafetyBlobs[0].IsHighRisk| Whether the document contains high risk items|\r\n| RelatedHealthAndSafetyBlobs[0].IsSentToVehicle| Whether the document is sent to vehicle|\r\n| RelatedHealthAndSafetyBlobs[0].HealthAndSafetyDocumentTypeListItem| The GUID and description of the health and safety document type|\r\n| IsDeleted| Whether site is deleted.|\r\n| LocalAuthorityListItem| The GUID and description of the local authority related to customer site.|\r\n| LocalAuthorityGuidFilter| Used to filter the local Authority Guid associated to the customer site|\r\n| CoCNumber| CoC Number of Customer Site.| \r\n| IsHeadQuarter| The site's customer head quarter location.|\r\n| EPAId| The site's EPA id.|\r\n| WasteCarrierLicenceNumber| The site's waste carrier licence number.|\r\n| WasteExemptionExpiryDate| The site's waste exemption expiry date.|\r\n| NVWANumber| The site's NVWA number.|"
