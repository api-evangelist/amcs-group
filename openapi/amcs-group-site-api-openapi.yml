- name: Site
paths:
  /directory/sites/changes:
    get:
      tags:
      - Site
      summary: Retrieve changes
      description: '| Property| Description|

        | ------------------------------------------------- | ------------------------------------------------------------------------------------------------- |

        | GUID| The GUID associated to the site.|

        | Name| The site''s name.|

        | Reference| An alternative name used for the site. Filterable|

        | FederalId| The site''s local authority / government / tax reference.|

        | AnalysisCode| The site''s analysis code|

        | UniqueCustomerSiteCode| The unique code assigned to the site if system configuration "UniqueCustomerSiteCodeGeneration" was set to true when site was created. |

        | IsNonServiceSite | Whether the site is non-service. |

        | RelatedCustomerGuid| The GUID associated to the customer of this site. Filterable.|

        | SiteTypeListItem| The GUID and type of the site (eg. Unoccupied Location, Residential, Non Residential).|

        | SICCodeListItem| The GUID and 2007 description of SICCode|

        | SalesTerritoryListItem| The GUID and name of the sales territory this site is associated to.|

        | CompanyOutletListItem| The GUID and name of the default company outlet this site is associated to.|

        | CustomerSiteStateListItem| The GUID and state of the site (eg. Active, Closed, Suspended).|

        | ZoneListItem| The GUID and description of the zone.|

        | RebatePaymentTypeListItem| The GUID and description of the rebate payment type.|

        | RebatePaymentTermListItem| The GUID and description of the rebate payment term.|

        | ContactMethods.Email| The Email associated to the site.|

        | PaymentHandlingCodeListItem| The GUID and description of the payment handling code.|

        | ReminderLetterPolicyListItem| The GUID and description of the reminder letter policy.|

        | VisitStatusListItem| The GUID and description of the visit status.|

        | RelatedLocationInvoiceGuid| Used to filter the related invoice location guid associated to the invoice location of this site.|

        | RelatedLocationRemitGuid| Used to filter the related remit location guid associated to the remit location of this site.|

        | RelatedLocationGuid| Used to filter the related location guid associated to the location of the site.|

        | RelatedTaxJurisdictionGuid| The GUID associated to the tax jurisdiction of this site. Filterable.|

        | AccessTimes[0]| A list of objects containing customer site access time.|

        | AccessTimes[0].Guid| The GUID associated to the site access time.|

        | AccessTimes[0].AccessContact| The access contact name to associated site.|

        | AccessTimes[0].AccessNotes| The access notes to associated site.|

        | AccessTimes[0].AccessStartTime| The access start time to associated site.|

        | AccessTimes[0].AccessEndTime| The access end time to associated site.|

        | AccessTimes[0].DayOfWeekListItem| The GUID and description of the day of week to access.|

        | DocumentDeliveryMethods[]| The array of document delivery types associated to the customer site.|

        | DocumentDeliveryMethods[0].DocumentDeliveryType| The GUID and description of the document delivery type associated to the DocumentDeliveryMethods.'
      operationId: Site_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges_ApiIntegratorSiteResource'
