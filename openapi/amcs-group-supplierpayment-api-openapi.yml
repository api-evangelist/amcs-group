        DateBadExported:
          type: string
          format: localDate
          example: '2000-01-01'
        DateCleared:
          type: string
          format: localDate
          example: '2000-01-01'
        DateExported:
          type: string
          format: localDate
          example: '2000-01-01'
        DateProcessed:
          type: string
          format: localDate
          example: '2000-01-01'
        Notes:
          type: string
        PayableCycleListItem:
