openapi: 3.0.1
info:
  title: Core AccessGroup SupplierPayment API
  version: core
tags:
- name: SupplierPayment
paths:
  /accounting/supplierPayments/changes:
    get:
      tags:
      - SupplierPayment
      summary: Retrieve changes
      description: "| Property| Description|\r\n| ------------------------------------------------- | ------------------------------------------------------------------------------------------------------|\r\n| GUID| The GUID associated to the supplier payment.|\r\n| Amount| Amount of the supplier payment.|\r\n| DateInput| The input date associated to the supplier payment.|\r\n| DateReceived| The received date associated to the supplier payment.|\r\n| IsBad| Whether the supplier payment is bad.|\r\n| PaymentTypeListItem| The GUID and description of the payment type associated to the supplier payment.|\r\n| RelatedSupplierGuid| The GUID associated to the supplier of the supplier payment. Filterable.|\r\n| AccountingPeriodListItem| The GUID and description of the accounting period associated to the supplier payment.|\r\n| APPaymentStatusListItem| The GUID and description of the AP payment status associated to the supplier payment.|\r\n| DateBad| The bad date associated to the supplier payment.|\r\n| DateBadExported| The exported bad date associated to the supplier payment.|\r\n| DateCleared| The cleared date associated to the supplier payment.|\r\n| DateExported| The exported date associated to the supplier payment.|\r\n| DateProcessed| The processed date associated to the supplier payment.|\r\n| Notes| The notes associated to the supplier payment.|\r\n| PayableCycleListItem| The GUID and description of the payable cycle associated to the supplier payment.|\r\n| PaymentPointListItem| The GUID and description of the payment point associated to the supplier payment.|\r\n| Reference| The referenceassociated to the supplier payment.|\r\n| Allocations[0]| List of supplier payment allocation made for the supplier payment.| \r\n| Allocations[0].Amount| Amount of the supplier payment allocation.| \r\n| Allocations[0].DateInput| The input date associated to the supplier payment allocation.| \r\n| Allocations[0].RelatedSupplierBillGuid            | The GUID associated to the supplier bill of the supplier payment.| \r\n| RelatedSupplierBillGuidFilter| The filter used to filter the related supplier bill guid associated to the Allocation. Filterable.|\r\n| IsDeleted| Supplier Payment is being deleted?|\r\n"
      operationId: SupplierPayment_GetChanges
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceChanges[ApiIntegratorSupplierPaymentResource]'
  /accounting/supplierPayments/{guid}:
    get:
      tags:
      - SupplierPayment
      summary: Find with GUID
      description: "| Property| Description|\r\n| ------------------------------------------------- | ------------------------------------------------------------------------------------------------------|\r\n| GUID| The GUID associated to the supplier payment.|\r\n| Amount| Amount of the supplier payment.|\r\n| DateInput| The input date associated to the supplier payment.|\r\n| DateReceived| The received date associated to the supplier payment.|\r\n| IsBad| Whether the supplier payment is bad.|\r\n| PaymentTypeListItem| The GUID and description of the payment type associated to the supplier payment.|\r\n| RelatedSupplierGuid| The GUID associated to the supplier of the supplier payment. Filterable.|\r\n| AccountingPeriodListItem| The GUID and description of the accounting period associated to the supplier payment.|\r\n| APPaymentStatusListItem| The GUID and description of the AP payment status associated to the supplier payment.|\r\n| DateBad| The bad date associated to the supplier payment.|\r\n| DateBadExported| The exported bad date associated to the supplier payment.|\r\n| DateCleared| The cleared date associated to the supplier payment.|\r\n| DateExported| The exported date associated to the supplier payment.|\r\n| DateProcessed| The processed date associated to the supplier payment.|\r\n| Notes| The notes associated to the supplier payment.|\r\n| PayableCycleListItem| The GUID and description of the payable cycle associated to the supplier payment.|\r\n| PaymentPointListItem| The GUID and description of the payment point associated to the supplier payment.|\r\n| Reference| The referenceassociated to the supplier payment.|\r\n| Allocations[0]| List of supplier payment allocation made for the supplier payment.| \r\n| Allocations[0].Amount| Amount of the supplier payment allocation.| \r\n| Allocations[0].DateInput| The input date associated to the supplier payment allocation.| \r\n| Allocations[0].RelatedSupplierBillGuid            | The GUID associated to the supplier bill of the supplier payment.| \r\n| RelatedSupplierBillGuidFilter| The filter used to filter the related supplier bill guid associated to the Allocation. Filterable.|\r\n| IsDeleted| Supplier Payment is being deleted?|\r\n"
      operationId: SupplierPayment_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorSupplierPaymentResource]'
    put:
      tags:
      - SupplierPayment
      summary: Partial update
      description: "| Property| Description| Required |\r\n| ------------------------------------------------- | ------------------------------------------------------------------------------------------------------| -------- |\r\n| GUID| The GUID associated to the supplier payment.| No    |\r\n| Amount| Amount of the supplier payment.| Yes   |\r\n| DateInput| The input date associated to the supplier payment.| Yes   |\r\n| DateReceived| The received date associated to the supplier payment.| Yes   |\r\n| IsBad| Whether the supplier payment is bad.| Yes   |\r\n| PaymentTypeListItem| The GUID and description of the payment type associated to the supplier payment.| Yes   |\r\n| RelatedSupplierGuid| The GUID associated to the supplier of the supplier payment. Filterable.| Yes   |\r\n| AccountingPeriodListItem| The GUID and description of the accounting period associated to the supplier payment.| No    |\r\n| APPaymentStatusListItem| The GUID and description of the AP payment status associated to the supplier payment.| No    |\r\n| DateBad| The bad date associated to the supplier payment.| No    |\r\n| DateBadExported| The exported bad date associated to the supplier payment.| No    |\r\n| DateCleared| The cleared date associated to the supplier payment.| No    |\r\n| DateExported| The exported date associated to the supplier payment.| No    |\r\n| DateProcessed| The processed date associated to the supplier payment.| No    |\r\n| Notes| The notes associated to the supplier payment.| No    |\r\n| PayableCycleListItem| The GUID and description of the payable cycle associated to the supplier payment.| No    |\r\n| PaymentPointListItem| The GUID and description of the payment point associated to the supplier payment.| No    |\r\n| Reference| The referenceassociated to the supplier payment.| No    |\r\n| Allocations[0]| List of supplier payment allocation made for the supplier payment.| No    | \r\n| Allocations[0].Amount| Amount of the supplier payment allocation.| Yes   | \r\n| Allocations[0].DateInput| The input date associated to the supplier payment allocation.| Yes   | \r\n| Allocations[0].RelatedSupplierBillGuid            | The GUID associated to the supplier bill of the supplier payment.| Yes   | \r\n| RelatedSupplierBillGuidFilter| The filter used to filter the related supplier bill guid associated to the Allocation. Filterable.| No    |\r\n| IsDeleted| Supplier Payment is being deleted?| No    |\r\n\r\n**Extra validations**\r\n\r\n| Condition | Error message |\r\n| --------- | ------------- |\r\n| If RelatedSupplierGuid provided is Deleted. | The provided RelatedSupplierGuid is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If PaymentTypeListItem.Guid provided is Deleted. | The provided PaymentTypeListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If AccountingPeriodListItem.Guid provided is Deleted. | The provided AccountingPeriodListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If APPaymentStatusListItem.Guid provided is Deleted. | The provided APPaymentStatusListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If PayableCycleListItem.Guid provided is Deleted. | The provided PayableCycleListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If PaymentPointListItem.Guid provided is Deleted. | The provided PaymentPointListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If RelatedSupplierBillGuid provided is Deleted. | The provided RelatedSupplierBillGuid is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If we attempt to delete a supplier payment | IsDeleted is TRUE. Could not process the request. SupplierPayment can not be deleted via the REST API. |\r\n| If we attempt to delete a supplier payment allocation | IsDeleted is TRUE. Could not process the request. Allocation can not be deleted via the REST API. |\r\n| If we provide supplier payment allocation with Guid of another supplier payment allocation | Failed to save. Allocations with Guid of xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx does not belong to SupplierPayment |\r\n| If we provide same RelatedSupplierBillGuid more than one time in allocations array | Failed to save. Allocations already exists with RelatedSupplierBillGuid of xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx. |\r\n| If we provide RelatedSupplierBillGuid already exist in SupplierBillSupplierPayment(allocations) | Failed to save. SupplierBillSupplierPayment already exists with RelatedSupplierBillGuid of xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx. |"
      operationId: SupplierPayment_Update
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiIntegratorSupplierPaymentResource'
        required: true
        x-bodyName: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceId'
