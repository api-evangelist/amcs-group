components:
  schemas:
    ApiIntegratorAllocationResource:
      type: object
      properties:
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        Amount:
          type: number
          format: double
        DateInput:
          type: string
          format: localDate
          example: '2000-01-01'
        RelatedSupplierBillGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        IsDeleted:
          type: boolean
    ApiIntegratorListItemResource:
