openapi: 3.0.1
info:
  title: Core AccessGroup SupplierType API
  version: core
tags:
- name: SupplierType
paths:
  /lists/supplierTypes/{guid}:
    get:
      tags:
      - SupplierType
      summary: Find with GUID
      description: "| Property                  | Description                                                           |\r\n| ------------------------- | --------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the supplier type                              |\r\n| Description               | The description of the supplier type                                  |"
      operationId: SupplierType_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorSupplierTypeResource]'
  /lists/supplierTypes:
    get:
      tags:
      - SupplierType
      summary: Find with Filters
      description: "| Property                  | Description                                                           |\r\n| ------------------------- | --------------------------------------------------------------------- |\r\n| GUID                      | The GUID associated to the supplier type                              |\r\n| Description               | The description of the supplier type                                  |"
      operationId: SupplierType_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorSupplierTypeResource]'
