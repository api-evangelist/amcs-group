openapi: 3.0.1
info:
  title: Core AccessGroup TaxTemplateCollection API
  version: core
tags:
- name: TaxTemplateCollection
paths:
  /lists/taxTemplateCollections/{guid}:
    get:
      tags:
      - TaxTemplateCollection
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the tax template collection                       |\r\n| Description               | The description of the tax template collection   |\r\n| Code| The code of the tax template collection   |\r\n| IsDeleted                 | Whether the tax template collection is deleted   |"
      operationId: TaxTemplateCollection_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorTaxTemplateCollectionResource]'
  /lists/taxTemplateCollections:
    get:
      tags:
      - TaxTemplateCollection
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the tax template collection                       |\r\n| Description               | The description of the tax template collection   |\r\n| Code| The code of the tax template collection   |\r\n| IsDeleted                 | Whether the tax template collection is deleted   |"
      operationId: TaxTemplateCollection_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorTaxTemplateCollectionResource]'
