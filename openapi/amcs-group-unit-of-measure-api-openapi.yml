    ApiResourceResultCollection_ApiIntegratorUnitOfMeasurementResource:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorUnitOfMeasurementResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
