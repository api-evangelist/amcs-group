    ApiResourceStatus:
      type: object
      properties:
        id:
          type: integer
          format: int32
        isSuccess:
          type: boolean
    ApiIntegratorUnitOfMeasurementResource:
      type: object
      properties:
        Description:
          type: string
        IsDeleted:
          type: boolean
        Code:
          type: string
        PricingBasisListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        ShortName:
