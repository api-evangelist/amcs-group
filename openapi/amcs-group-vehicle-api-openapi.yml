components:
  schemas:
    ApiResourceId:
      type: object
      properties:
        resource:
          type: string
          format: uuid
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiIntegratorListItemResource:
      type: object
      properties:
        Description:
          type: string
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorVehicleTrailerResource:
      type: object
      properties:
        Guid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        RelatedTrailerGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiIntegratorVehicleResource:
      type: object
      properties:
        IsZeroWeightBinAccumulated:
          type: boolean
        IsNoTagStopEnabled:
          type: boolean
        RegistrationNo:
          type: string
        VehicleCode:
          type: string
        Make:
          type: string
        Model:
          type: string
        MaxWeight:
          type: number
          format: double
        TareWeight:
          type: number
          format: double
        VolumeCapacity:
          type: number
          format: double
        Notes:
          type: string
        CompanyOutletListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        FilterCompanyOutletListItemGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        ContainerTypeListItems:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorVehicleContainerTypeResource'
        VehicleTypeListItem:
          $ref: '#/components/schemas/ApiIntegratorListItemResource'
        RelatedSupplierGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        RelatedSupplierSiteGuid:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        Trailers:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorVehicleTrailerResource'
        RelatedTrailerGuidFilter:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        GUID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
    ApiResourceChanges_ApiIntegratorVehicleResource:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorVehicleResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultUpdatesExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
