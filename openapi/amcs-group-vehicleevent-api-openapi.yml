          format: int32
        isSuccess:
          type: boolean
    ApiIntegratorVehicleEventResource:
      type: object
      properties:
        AdditionalInformation:
          type: string
        BinVisitedCount:
          type: integer
          format: int32
        CurrentWeight:
          type: number
          format: double
        Distance:
          type: number
          format: double
        FlexibleData:
          type: string
        IsGeoCompressed:
          type: boolean
        Location:
