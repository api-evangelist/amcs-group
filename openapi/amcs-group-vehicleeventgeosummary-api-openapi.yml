hicleGuid Is Null Or Not Provided      | The mandatory property RelatedVehicleGuid has a null value. The request could not be processed. Supply a value for the RelatedVehicleGuid property of the submitted resource. |\r\n| RelatedVehicleGuid belongs to a deleted Vehicle | The provided RelatedVehicleGuid is deleted. Could not update the resource. Please check the relevant list end point for the available options.                                |\r\n"
