openapi: 3.2.0
info:
  title: AMCS Platform REST Vehicle Type API
  description: '![latest End points](/amcsrestapi/diagram/endpointslatest.svg)


    # Overview


    ## Who Should Read this Document


    This document contains a technical description of the AMCS Platform REST API.'
  version: latest
servers:
- url: https://ete-p5-tst-svc-core.amcsplatform.com/erp/api/integrator/erp
tags:
- name: VehicleType
paths:
  /lists/vehicleTypes/{guid}:
    get:
      tags:
      - VehicleType
      summary: Find with GUID
      description: '| Property | Description |

        | ------------------------- | ------------------------------------------------------------------------ |

        | GUID | The GUID associated to the vehicle type. |

        | Description | The description of the vehicle type. |

        | Code| The code associated to the vehicle type. |

        | CollectionType | The collectionType associated to the vehicle type. |'
      operationId: VehicleType_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity_ApiIntegratorVehicleTypeResource'
  /lists/vehicleTypes:
    get:
      tags:
      - VehicleType
      summary: Find with Filters
      description: '| Property | Description |

        | ------------------------- | ------------------------------------------------------------------------ |

        | GUID | The GUID associated to the vehicle type. |

        | Description | The description of the vehicle type. |

        | Code| The code associated to the vehicle type. |

        | CollectionType | The collectionType associated to the vehicle type. |'
      operationId: VehicleType_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection_ApiIntegratorVehicleTypeResource'
