openapi: 3.0.1
info:
  title: Core AccessGroup VehicleType API
  version: core
tags:
- name: VehicleType
paths:
  /lists/vehicleTypes/{guid}:
    get:
      tags:
      - VehicleType
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the vehicle type.   |\r\n| Description               | The description of the vehicle type.                                     |\r\n| Code| The code associated to the vehicle type.                                 |\r\n| CollectionType            | The collectionType associated to the vehicle type.                       |\r\n"
      operationId: VehicleType_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorVehicleTypeResource]'
  /lists/vehicleTypes:
    get:
      tags:
      - VehicleType
      summary: Find with Filters
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the vehicle type.   |\r\n| Description               | The description of the vehicle type.                                     |\r\n| Code| The code associated to the vehicle type.                                 |\r\n| CollectionType            | The collectionType associated to the vehicle type.                       |\r\n"
      operationId: VehicleType_GetCollection
      parameters:
      - name: filter
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: includeCount
        in: query
        schema:
          type: boolean
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultCollection[ApiIntegratorVehicleTypeResource]'
components:
  schemas:
    ApiResourceResultEntity[ApiIntegratorVehicleTypeResource]:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ApiIntegratorVehicleTypeResource'
        links:
          $ref: '#/components/schemas/ApiResourceResultEntityLinks'
        extra:
          $ref: '#/components/schemas/ApiResourceResultEntityExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
        status:
          $ref: '#/components/schemas/ApiResourceStatus'
    ApiResourceResultCollection[ApiIntegratorVehicleTypeResource]:
      type: object
      properties:
        resource:
          type: array
          items:
            $ref: '#/components/schemas/ApiIntegratorVehicleTypeResource'
        extra:
          $ref: '#/components/schemas/ApiResourceResultCollectionExtra'
        errors:
          $ref: '#/components/schemas/ApiResourceErrors'
