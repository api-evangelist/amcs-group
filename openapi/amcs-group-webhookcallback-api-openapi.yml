openapi: 3.0.1
info:
  title: Core AccessGroup WebHookCallback API
  version: core
tags:
- name: WebHookCallback
paths:
  /services/api/webhook/callback:
    post:
      tags:
      - WebHookCallback
      parameters:
      - name: registrationKey
        in: query
        schema:
          type: string
      - name: id
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: txid
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
