er of weighing out.                                       | No |\r\n| WeighingOuts[0].MaterialListItem      | The GUID and description of the material list associated to the weighing out. | Yes |\r\n| WeighingOuts[0].ContainerTypeListItem | The GUID and description of the container type associated to the weighing out.| No |\r\n| WeighingOuts[0].RelatedTreatmentGuid  | The GUID of the treatment code associated to the weighing out.| No |\r\n| WeighingOuts[0].RelatedWeighingInGuid| The GUID associated to the weighing in of the weighing out.           | No |\r\n| WeighingOuts[0].Weights                       | The weight data assosicated to the weighing out.                      | No |\r\n| WeighingOuts[0].Weights.GrossWeight           | The gross weight data associated to the weighing out.                 | No |\r\n| WeighingOuts[0].Weights.GrossWeight.Guid      | The GUID associated to the gross weight of the weighing out.          | No |\r\n| WeighingOuts[0].Weights.GrossWeight.Weight    | The weight associated to the gross weight of the weighing out.        | No |\r\n| WeighingOuts[0].Weights.GrossWeight.Timestamp | The timestamp associated to the gross weight of the weighing out.     | No |\r\n| WeighingOuts[0].Weights.GrossWeight.WeightTypeListItem         | The GUID and description of the weight type associated to the WeighingOuts.Weights gross weight.                 | Yes if WeighingOuts.Weights.GrossWeight not null |\r\n| WeighingOuts[0].Weights.TareWeight            | The tare weight data associated to the weighing out.                  | No |\r\n| WeighingOuts[0].Weights.TareWeight.Guid       | The GUID associated to the tare weight of the weighing out.           | No |\r\n| WeighingOuts[0].Weights.TareWeight.Weight     | The weight associated to the tare weight of the weighing out.         | No |\r\n| WeighingOuts[0].Weights.TareWeight.Timestamp  | The timestamp associated to the tare weight of the weighing out.      | No |\r\n| WeighingOuts[0].Weights.Tare