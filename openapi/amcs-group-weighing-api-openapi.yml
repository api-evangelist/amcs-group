lobWeighingDocketPdfHashes | The array of related weighing docket blob hashes. | No |\r\n| RelatedBlobWeighingDocketPdfHashes[0].Hash | The hash of the weighing docket blob to be used against the /blob endpoint. Files are provided as an octet stream which will need to be converted. | No |\r\n| RelatedWeighingInDetailGuid| Used to filter on weighing with weighing in detail of provided GUID.| No |\r\n| RelatedJobOverrideBreakdownGuid| Used to filter on weighing with weighing in detail job override breakdown of provided GUID.           | No |\r\n| WeighingOutsRelatedWeighingInGuidFilter                   | Used to filter the related weighing in guid associated to the weighing out.| No |\r\n\r\n**Extra validations**\r\n\r\n| Condition | Error message |\r\n| --------- | ------------- |\r\n| For Gate, ScheduledJob and MaterialSale if provided Job does not have a SiteOrder. | RelatedJobGuid must be a job with a site order. |\r\n| For Gate, ScheduledJob, Route and MaterialSale if provided Job is linked to another Weighing. | The weighing must be unique per job. |\r\n| If weighing is inbound or Route and WeighingOut provided. (1) | WeighingOut: is not supported. |\r\n| If weighing is outbound or Route and WeighingIn provided. (2) | WeighingIn: is not supported. |\r\n| If Weights.TareWeight.Weight is bigger then Weights.GrossWeight.Weight. | Weights.GrossWeight.Weight: Must be greater than the then Weights.TareWeight.Weight |\r\n| If WeighingIns[0].Weights.TareWeight.Weight is bigger then WeighingIns[0].Weights.GrossWeight.Weight. | WeighingIns[0].Weights.GrossWeight.Weight: Must be greater than the then WeighingIns[0].Weights.TareWeight.Weight |\r\n| If WeighingIns[0].TareTallyNo is not null on create or value changed on update. | WeighingIns[0].TareTallyNo is a read-only property |\r\n| If WeighingOuts[0].Weights.TareWeight.Weight is bigger then WeighingOuts[0].Weights.GrossWeight.Weight. | WeighingOuts[0].Weights.GrossWeight.Weight: Must be greater than the then WeighingOuts[0].Weights.TareWeight.Weight |\r\n| If WeighingOuts[0].GrossTallyNo is not null on create or value changed on update. | WeighingOuts[0].GrossTallyNo is a read-only property |\r\n| For Gate if RelatedVehicleGuid is provided. | RelatedVehicleGuid: is not supported. |\r\n| For weighing, if IsExternalVehicle set to true and RelatedExternalVehicleGuid is not provided | For Weighing, IsExternalVehicle property has been set as true, therefore RelatedExternalVehicleGuid property must also be set. |\r\n| For weighing, if RelatedExternalVehicleGuid have value and IsExternalVehicle set to false | For Weighing, RelatedExternalVehicleGuid property have seen set, therefore IsExternalVehicle property must be set as true. |\r\n| For weighing, if RelatedVehicleGuid and RelatedExternalVehicleGuid was provided  | Either RelatedExternalVehicleGuid or RelatedVehicleGuid properties must be set. |\r\n| For weighing, if IsComplete set to true | Attempted to create a completed weighing. Weighing could not be created. Create the weighing and then set the IsComplete flag via an update. |\r\n| If Weights.BridgeName is more than 100 characters long | BridgeName must be no more than 100 characters long. |\r\n| If ContainerIdentifier is more than 50 characters long | ContainerIdentifier must be no more than 50 characters long. |\r\n| If SealIdentifier is more than 50 characters long | SealIdentifier must be no more than 50 characters long. |\r\n| If CustomerRound is provided and the weighing type is other than Gate or ScheduledJob | Failed to save/update Weighing because CustomerRound can be set only for Gate and ScheduledJob weighings. |\r\n| If the Guid of the GrossManualWeightReasonListItem, TareManualWeightReasonListItem is deleted | The provided GrossManualWeightReasonListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If the Guid of the GrossManualWeightReasonListItem, TareManualWeightReasonListItem is not listed in the ReasonCategory under Manual weighing | Invalid GrossManualWeightReasonListItem.Guid. Reason must be from 'ManualWeighing' reason category. |\r\n\r\n1) Inbound are weighings of type Gate, ScheduledJob and TransferOut (if the weighing is not linked to another weighing via TransferDestinationWeighingId)\r\n2) Outbound are weighings of type MaterialSale and TransferOut (if the weighing is linked to another weighing via TransferDestinationWeighingId)\r\n\r\n| RelatedBlobWeighingDocketPdfHashes[0].Hash is not null for Insert | Failed to save Weighing because RelatedBlobWeighingDocketPdfHashes creation is not permitted. |\r\n| RelatedBlobWeighingDocketPdfHashes[0].Hash is not null for Update and the Weighing did not have RelatedBlobWeighingDocketPdfHashes initially | Failed to save/update Weighing because RelatedBlobWeighingDocketPdfHashes do not exist for the Weighing. |\r\n| RelatedBlobWeighingDocketPdfHashes[0].Hash is not null for Update and Invalid Hash | Could not find WeighingDocketOutput matching template. |\r\n| WeighingIns[0].Details[0].Guid is not null on insert | Attempting to update WeighingIns[0].Details[0] when creating the weighing. Could not process the request. Provide WeighingIns[0].Details[0] without a Guid property to create new WeighingIns[0].Details[0] rather than attempting an update. |\r\n| WeighingIns[0].Details[0].IsDeleted is true | IsDeleted is TRUE. Could not process the request. WeighingIns[0].Details[0] can not be deleted via the REST API. |\r\n| If the GUID passed to WeighingIns[0].Details[0].ReasonListItem has a value that is deleted | The provided WeighingIns[0].Details[0].ReasonListItem is deleted. Could not update the resource. Please check the relevant list end point for the available options. |\r\n| If Weights.GrossWeight.TallyNo is more than 20 characters long | TallyNo must be no more than 20 characters long. |\r\n| If Weights.TareWeight.TallyNo is more than 20 characters long | TallyNo must be no more than 20 characters long. |"
