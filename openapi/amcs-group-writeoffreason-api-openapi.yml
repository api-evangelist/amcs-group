info:
  title: Core AccessGroup WriteOffReason API
  version: core
tags:
- name: WriteOffReason
paths:
  /lists/writeOffReasons/{guid}:
    get:
      tags:
      - WriteOffReason
      summary: Find with GUID
      description: "| Property                  | Description                                                              |\r\n| ------------------------- | ------------------------------------------------------------------------ |\r\n| GUID                      | The GUID associated to the write off reason                              |\r\n| Description               | The description of the write off reason                                  |\r\n| AnalysisCode              | The analysis code of the write off reason                                |\r\n| IsDeleted                 | Whether the write off reason is deleted   |\r\n\r\n"
      operationId: WriteOffReason_Get
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: udf
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceResultEntity[ApiIntegratorWriteOffReasonResource]'
